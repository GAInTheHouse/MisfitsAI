.blob if batch.source_file.attached?","    batch.destroy","    blob&.purge # deletes the stored file now (not via a job, which may be what failed)","  rescue StandardError => e","    Rails.logger.error(\"[IntakeUpload] cleanup of batch #{batch.id} failed: #{e.class}\")","  end","end"],"lines":[null,null,null,null,null,null,null,null,null,null,null,null,null,2,2,null,2,null,2,17,null,17,15,null,4,4,null,13,null,null,2,4,4,4,null,0,null,null],"lines_covered_percent":93.33333333333333,"covered_lines":14,"missed_lines":1,"omitted_lines":23,"total_lines":15},"app/controllers/garment_laundries_controller.rb":{"source":["# frozen_string_literal: true","","class GarmentLaundriesController \u003c ApplicationController","  before_action :authenticate_user!","","  def update","    @garment = current_user.garments.find(params[:id])","    if @garment.in_laundry?","      @garment.mark_washed!","      notice = \"#{@garment.name} marked clean and ready to wear.\"","    else","      @garment.send_to_laundry!","      notice = \"#{@garment.name} sent to laundry.\"","    end","","    respond_to do |format|","      format.turbo_stream do","        flash.now[:notice] = notice","        render turbo_stream: turbo_stream.replace(helpers.dom_id(@garment), partial: \"garments/garment\", locals: { garment: @garment })","      end","      format.html { redirect_back fallback_location: wardrobe_path, notice: notice }","    end","  end","","  def wash_all","    laundry_items = current_user.garments.in_laundry","    count = laundry_items.count","    laundry_items.find_each(&:mark_washed!)","    notice = count.positive? ? \"Washed #{count} #{'item'.pluralize(count)} — everything is clean!\" : \"Laundry basket is already empty.\"","    redirect_back fallback_location: wardrobe_path, notice: notice","  end","end"],"lines":[null,null,2,2,null,2,2,2,1,1,null,1,1,null,null,2,2,0,0,null,4,null,null,null,2,1,1,1,1,1,null,null],"lines_covered_percent":90.0,"covered_lines":18,"missed_lines":2,"omitted_line en = creds.token","      user.google_refresh_token = creds.refresh_token if creds.refresh_token.present?","      user.google_token_expires_at = Time.zone.at(creds.expires_at) if creds.expires_at","      user.save!","    end","","    def after_sign_in_path_for(resource)","      session.delete(:return_to) || calendar_connect_origin || super","    end","","    # OmniAuth keeps the request's origin param (the week plan's Connect button sends /week_plan?sync=1).","    # Only week plan paths are followed, so the param cannot become an open redirect.","    def calendar_connect_origin","      origin = request.env[\"omniauth.origin\"].to_s","      path = URI.parse(origin).then { |uri| uri.host.nil? && uri.scheme.nil? ? uri.path : nil }","      origin if path == week_plan_path","    rescue URI::InvalidURIError","      nil","    end","  end","end"],"lines":[null,null,2,2,2,null,2,9,9,0,0,null,null,9,9,1,1,1,null,null,8,8,8,null,8,null,0,0,0,null,null,2,null,1,null,null,2,null,2,3,3,3,1,1,1,null,3,null,null,null,null,2,6,6,null,5,5,5,null,null,2,8,8,8,8,8,null,null,2,8,null,null,null,null,2,8,16,8,null,0,null,null,null],"lines_covered_percent":88.0,"covered_lines":44,"missed_lines":6,"omitted_lines":33,"total_lines":50},"app/controllers/users/registrations_controller.rb":{"source":["# frozen_string_literal: true","","module Users","  class RegistrationsController \u003c Devise::RegistrationsController","    protected","","    def after_sign_up_path_for(resource)","      after_sign_in_path_for(resource)","    end","","    def after_inactive_sign_up_path_for(resource)","      after_sign_in_path_for(resource)","    end","  end","end"],"lines":[null,null,2,2,2,null,2,6,null,null,2,0,null,null,null],"lines_covered_percent":85.71428571428571,"covered_lines":6,"missed_lines":1,"omitted_lines":8,"total_lines":7},"app/controllers/wardrobe/drafts_controller.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # PATCH /wardrobe/drafts/:id: toggle a draft's selection or e error(message)","      @error = message","      render :new, status: :unprocessable_entity","    end","  end","end"],"lines":[null,null,2,null,null,null,2,2,null,2,2,2,null,2,2,2,2,2,null,2,2,null,2,null,2,93,93,93,80,79,null,78,77,null,null,2,null,2,null,2,118,null,null,2,14,null,null,null,2,13,12,null,10,10,10,null,null,10,4,4,6,4,2,1,1,null,1,null,6,null,1,null,null,null,2,4,null,null,2,4,null,null,null,2,2,2,null,null,2,7,7,null,null,null],"lines_covered_percent":100.0,"covered_lines":55,"missed_lines":0,"omitted_lines":39,"total_lines":55},"app/controllers/wardrobe/searches_controller.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # Describe item > Search (design doc 6.5): search Google Images through SerpAPI, then add a result.","  class SearchesController \u003c ApplicationController","    SEARCH_FIELDS = %i[brand keywords category color material kind formality seasonality gender].freeze","","    rescue_from Wardrobe::Search::Error, with: :render_search_error","","    # GET /wardrobe/searches/new: the search form on its own page (the wardrobe page embeds the same form).","    def new","      @search = {}","    end","","    # POST /wardrobe/searches: results render into the garment_search_results frame.","    def create","      @search = search_params","      @results = Wardrobe::Search::ImageSearch.call(","        query: [ @search[:brand], @search[:keywords] ].compact_blank.join(\" \"),","        color: @search[:color], material: @search[:material], kind: @search[:kind], gender: @search[:gender]","      )","    end","","    # POST /wardrobe/searches/select: add one result to the signed-in user's wardrobe.","    def select","      @garment = Wardrobe::Search::AddResult.call(","        user: current_user, image_url: params[:image_url], title: params[:title],","        source_url: params[:source_url], attributes: search_params","      )","      notice = \"Added #{@garment.name} to your wardrobe.\"","      respond_to do |format|"," : true","","# Shared by the jobs that process an intake batch (photo and receipt image): failing the batch, deleting the","# uploaded file once the batch is finished, and broadcasting the batch card. The including job sets @batch","# and defines #batch_partial.","module IntakeBatchJobSupport","  extend ActiveSupport::Concern","","  included do","    # Handlers declared later win, so this catch-all must come before the job's specific handlers.","    rescue_from(StandardError) do |error|","      # The batch was discarded or purged while the job ran: nothing left to report, nothing to recreate.","      next unless IntakeBatch.exists?(arguments.first)","","      fail_batch(self.class::PROCESSING_FAILED)","      raise error","    end","  end","","  private","","  # Always works on a freshly loaded batch. The failure may come from a rolled-back transaction that created","  # drafts through @batch.garment_drafts; those objects are unsaved again but still in @batch's association, and","  # saving @batch would insert them again.","  def fail_batch(message)","    @batch = IntakeBatch.find_by(id: arguments.first)","    return unless @batch","","    @batch.mark_failed!(message)","    purge_source","    broadcast_batch","  end","","  def purge_source","    @batch.source_file.purge_later if @batch.source_file.attached?","  end","","  def broadcast_batch","    Turbo::StreamsChannel.broadcast_replace_to(","      [ @batch.user, :wardrobe ], target: @batch, partial: batch_partial, locals: { batch: @batch.reload }","    )","  end","end"],"lines":[null,null,null,null,null,2,2,null,2,null,4,null,3,null,3,3,null,null,null,2,null,null,null,null,2,19,19,null,19,19,19,null,null,2,24,null,null,2,37,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":18,"missed_lines":0,"omitted_lines":25,"total_lines":18},"app/jobs/planner/explain_outfit_job.rb":{"source":["# frozen_string_literal: true","","module Planner","  class ExplainOutfitJob \u003c ApplicationJob","    queue_as :ai_text","","    def perform(recommendation_id)","      rec = OutfitRecommendation.includes(:week_plan, :top, :bottom, :dress, :outerwear, :shoes)","                                .find_by(id: recommendation_id)","      return unless rec","","      user = rec.week_plan.user","      prompt = Prompts.explanation_prompt(rec)","      facts = Prompts.facts(rec)","      system = Prompts::EXPLANATION_SYSTEM","","      text, used_template = generate_explanation(user:, prompt:, facts:, system:, rec:)","      status = used_template ? \"failed\" : \"ready\"","","      rec.update!(explanation: text, explanation_status: status)","      broadcast_card(rec, user)","    end","","    private","","    def generate_explanation(user:, prompt:, facts:, system:, rec:)","      client = Ai::Client.current","      text = client.grounded_text(","        kind: :outfit_explanation, prompt:, facts:, system:, temperature: 0.7, user:","      )","      [ first_sentence(text), false ]","    rescue Ai::QuotaExceededError, Ai::DisabledError","      [ template_explanation(rec), true ]","    rescue Ai::Error","      begin","        text = client.generate_text(","          kind: :outfit_explanation,","          prompt: \"#{prompt}\\n#{facts.map { |f| f[:text] || f[\"text\"] }.join(\"\\n\")}\",","          system:,","          temperature: 0.7,","          max_output_tokens: 120,","          user:","        )","        [ first_sentence(text), false ]","      rescue Ai::Error","        [ template_explanation(rec), true ]","      end","    end","","    def first_sentence(text)","      text.to_s.strip.split(/(?\u003c=[.!?])\\s+/).first.to_s.presence || text.to_s.strip","    end","","    def template_explanation(rec)","      day_name = rec.date.strftime(\"%A\")","      event = rec.event_type.tr(\"_\", \" \")","      occasion = rec.segment_label.present? ? \"#{day_name} (#{rec.segment_label})\" : \"#{day_name} #{event}\"","      \"For your #{occasion}, we've put together the best available pieces from your wardrobe.\"","    end","","    def broadcast_card(rec, user)","      rec.reload","      Turbo::StreamsChannel.broadcast_replace_to(","        [ user, :planner ],","        target: ActionView::RecordIdentifier.dom_id(rec),","        partial: \"outfits/day_card\",","        locals: { rec: }","      )","      # Issue #8: the same outfit on the /outfits/today timeline.","      Turbo::StreamsChannel.broadcast_replace_to(","        [ user, :planner ],","        target: ActionView::RecordIdentifier.dom_id(rec, :timeline),","        partial: \"today_outfits/segment\",","        locals: { outfit: rec }","      )","    end","  end","end"],"lines":[null,null,2,2,2,null,2,38,null,38,null,38,38,38,38,null,38,38,null,38,38,null,null,2,null,2,38,38,null,null,29,null,0,null,null,9,null,24,null,null,null,null,null,1,null,8,null,null,null,2,30,null,null,2,8,8,8,8,null,null,2,38,38,null,null,null,null,null,null,38,null,null,null,null,null,null,null,null],"lines_covered_percent":97.14285714285714,"covered_lines":34,"missed_lines":1,"omitted_lines":43,"total_lines":35},"app/jobs/planner/sync_calendar_job.rb":{"source":["# frozen_string_literal: true","","module Planner","  class SyncCalendarJob \u003c ApplicationJob","    queue_as :calendar","","    def perform(user_id)","      user = User.find_by(id: user_id)","      return unless user","","      Planner::CalendarSync.new(user: user).sync!","    end","  end","end"],"lines":[null,null,2,2,2,null,2,9,9,null,9,null,null,null],"lines_covered_percent":100.0,"covered_lines":7,"missed_lines":0,"omitted_lines":7,"total_lines":7},"app/jobs/receipts/parse_image_job.rb":{"source":["# frozen_string_literal: true","","module Receipts","  # Reads a receipt photo or screenshot with Gemini (design doc 6.12 \"image_vision\") and turns its items into","  # drafts. The batch always ends ready or failed, and the uploaded image is deleted once it has.","  class ParseImageJob \u003c ApplicationJob","    include IntakeBatchJobSupport","","    queue_as :ai_text","","    # One run per batch at a time (Solid Queue): a duplicate enqueue cannot read the same receipt twice.","    limits_concurrency key: ->(batch_id) { \"intake-batch-#{batch_id}\" }, to: 1, duration: 10.minutes","","    READ_FAILED = \"We couldn't read that receipt right now. Please try again.\"","    PROCESSING_FAILED = READ_FAILED # used by IntakeBatchJobSupport's catch-all","    QUOTA_REACHED = \"You've reached today's receipt reading limit. Please try again tomorrow.\"","    UNREADABLE = \"We couldn't read that image. Please upload a receipt photo, screenshot or PDF.\"","    MAX_SIDE = 2400 # receipts need more pixels than outfit photos for small print","","    rescue_from(Ai::ContentBlockedError, Ai::DisabledError, MalformedResponseError) do |error|","      Rails.logger.info(\"[Receipts::ParseImageJob] batch #{arguments.first}: #{error.class}\")","      fail_batch(READ_FAILED)","    end","    rescue_from(Ai::QuotaExceededError) { fail_batch(QUOTA_REACHED) }","    rescue_from(Media::InvalidImageError, ActiveStorage::FileNotFoundError) { fail_batch(UNREADABLE) }","    retry_on Ai::TransientError, wait: :polynomially_longer, attempts: 3 do |job, _error|","      job.send(:fail_batch, READ_FAILED)","    end","    discard_on ActiveRecord::RecordNotFound","","    def perform(batch_id)","      @batch = IntakeBatch.receipts.find(batch_id)","      return if @batch.finished? # already read; safe to run again","      return fail_batch(UNREADABLE) unless @batch.source_file.attached?","","      @batch.mark_processing!(progress: 10)","      image = @batch.source_file.open do |file|","        Wardrobe::PhotoIntake::ImagePreparer.call(file.path, max_side: MAX_SIDE)","      end","      items = VisionParser.call(image: image, user: @batch.user)","      Intake.finish(@batch, items)","      purge_source","      broadcast_batch","    end","","    private","","    def batch_partial = \"wardrobe/receipts/batch\"","  end","end"],"lines":[null,null,2,null,null,2,2,null,2,null,null,3,null,2,2,2,2,2,null,2,1,1,null,4,3,2,1,null,2,null,2,14,13,12,null,12,12,12,null,11,5,5,5,null,null,2,null,2,null,null],"lines_covered_percent":100.0,"covered_lines":31,"missed_lines":0,"omitted_lines":19,"total_lines":31},"app/jobs/wardrobe/extract_garments_job.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # Photo intake, step 1 (design doc 6.6): asks Gemini which garments are in the uploaded photo, creates up","  # to six drafts and queues their product images. The batch always ends ready or failed; the source photo","  # is kept until GenerateDraftImageJob finishes (or the batch fails).","  class ExtractGarmentsJob \u003c ApplicationJob","    include IntakeBatchJobSupport","","    queue_as :ai_text","","    # One run per batch at a time (Solid Queue): a duplicate enqueue cannot analyze the same photo twice.","    limits_concurrency key: ->(batch_id) { \"intake-batch-#{batch_id}\" }, to: 1, duration: 10.minutes","","    ANALYZE_FAILED = \"We couldn't analyze that photo right now. Please try again.\"","    PROCESSING_FAILED = ANALYZE_FAILED # used by IntakeBatchJobSupport's catch-all","    NO_GARMENTS = \"No garments detected from image. Please upload a clearer outfit photo.\"","    QUOTA_REACHED = \"You've reached today's photo analysis limit. Please try again tomorrow.\"","    UNREADABLE = \"We couldn't read that photo. Please upload a JPEG, PNG, WebP or HEIC image.\"","","    STARTED_PROGRESS = 10","    DRAFTS_READY_PROGRESS = 30","","    # The catch-all (fail and re-raise) comes from IntakeBatchJobSupport; these specific handlers win over it.","    rescue_from(Ai::ContentBlockedError, Ai::DisabledError, PhotoIntake::MalformedResponseError) do |error|","      Rails.logger.info(\"[Wardrobe::ExtractGarmentsJob] batch #{arguments.first}: #{error.class}\")","      fail_batch(ANALYZE_FAILED)","    end","    rescue_from(Ai::QuotaExceededError) { fail_batch(QUOTA_REACHED) }","    rescue_from(Media::InvalidImageError, ActiveStorage::FileNotFoundError) { fail_batch(UNREADABLE) }","    retry_on Ai::TransientError, wait: :polynomially_longer, attempts: 3 do |job, _error|","      job.send(:fail_batch, ANALYZE_FAILED)","    end","    discard_on ActiveRecord::RecordNotFound","","    def perform(batch_id)","      @batch = IntakeBatch.photos.find(batch_id)","      return if @batch.finished? # already analyzed; safe to run again","      return fail_batch(UNREADABLE) unless @batch.source_file.attached?","","      @batch.mark_processing!(progress: STARTED_PROGRESS)","      # Downloaded to a temp file and read by libvips from disk, never loaded whole into Ruby memory.","      photo = @batch.source_file.open { |file| PhotoIntake::ImagePreparer.call(file.path) }","      response = Ai::Client.current.generate_json(","        kind: :garment_extraction, prompt: PhotoIntake::Prompts::EXTRACTION,","        schema: PhotoIntake::Prompts::GARMENT_SCHEMA, images: [ photo ], user: @batch.user","      )","      items = PhotoIntake::Mapper.call(response)","      return fail_batch(NO_GARMENTS) if items.empty?","","      drafts = create_drafts(items)","      return if drafts.nil? # another run already finished this batch","      broadcast_batch","      ActiveRecord.after_all_transactions_commit do","        ActiveJob.perform_all_later(drafts.map { Wardrobe::GenerateDraftImageJob.new(_1.id) })","      end","    end","","    private","","    # Drafts and the \"ready\" status are committed together, under the batch lock: a run that dies in between","    # leaves nothing half-done, and a rerun (retry, or Solid Queue re-running a crashed worker's job) finds","    # the batch finished instead of adding the drafts a second time. Returns nil in that case.","    def create_drafts(items)","      @batch.with_lock do","        next nil if @batch.finished?","","        drafts = items.each_with_index.map do |attrs, index|","          @batch.garment_drafts.create!(user: @batch.user, attrs: attrs, position: index, status: \"pending\")","        end","        @batch.update!(status: \"ready\", progress: DRAFTS_READY_PROGRESS, error: nil)","        drafts","      end","    end","","    def batch_partial = \"wardrobe/photo_intakes/batch\"","  end","end"],"lines":[null,null,2,null,null,null,2,2,null,2,null,null,3,null,2,2,2,2,2,null,2,2,null,null,2,3,3,null,4,3,2,2,null,2,null,2,37,36,34,null,34,null,68,33,null,null,null,20,18,null,15,13,13,13,38,null,null,null,2,null,null,null,null,2,15,14,null,14,27,null,14,13,null,null,null,2,null,null],"lines_covered_percent":100.0,"covered_lines":43,"missed_lines":0,"omitted_lines":35,"total_lines":43},"app/jobs/wardrobe/generate_draft_image_job.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # Photo intake, step 2 (design doc 6.6): a product image for one draft from the uploaded photo (multimodal","  # flatlay). A failed image leaves the draft ready without an image, so it can still be committed with the","  # category placeholder. If the draft is committed before its image is done, the image goes to the garment it","  # became (the one in attrs[\"garment_id\"], while that garment still waits for an image), so the AI call is","  # not wasted. The batch source photo is purged once every draft has left pending.","  class GenerateDraftImageJob \u003c ApplicationJob","    queue_as :ai_images","","    limits_concurrency key: ->(draft_id) { \"draft-image-#{draft_id}\" }, to: 1, duration: 10.minutes","","    IMAGE_UNAVAILABLE = \"Product image unavailable\"","","    rescue_from(StandardError) do |error|","      finish(error: IMAGE_UNAVAILABLE)","      raise error","    end","    rescue_from(Ai::DisabledError, Ai::QuotaExceededError, Ai::ContentBlockedError) { finish(error: IMAGE_UNAVAILABLE) }","    retry_on Ai::TransientError, wait: :polynomially_longer, attempts: 3 do |job, _error|","      job.send(:finish, error: IMAGE_UNAVAILABLE)","    end","    discard_on ActiveRecord::RecordNotFound","","    def perform(draft_id)","      @draft = GarmentDraft.find(draft_id)","      unless @draft.pending? || waiting_garment","        purge_source_batch_if_done","        return","      end","","      reference = PhotoIntake::ReferenceImage.call(@draft)","      unless reference","        finish(error: IMAGE_UNAVAILABLE)","        return","      end","","      image = Ai::Client.current.generate_image_multimodal(","        kind: :garment_image,","        prompt: PhotoIntake::Prompts.reference_flatlay(@draft.attrs),","        images: [ reference ],","        aspect_ratio: \"1:1\",","        user: @draft.user","      )","      jpeg = Media::ImageNormalizer.to_square_jpeg(image.bytes, size: ENV.fetch(\"GARMENT_ASSET_SIZE\", 512).to_i)","      garment = attach(jpeg)","      purge_source_batch_if_done","      garment ? Wardrobe::GarmentBroadcasts.image_changed(garment) : finish","    end","","    private","","    # The garment this draft became while its image was still being made, if that garment still waits for one.","    def waiting_garment","      return unless @draft.committed? && @draft.attrs[\"garment_id\"]","","      Garment.find_by(id: @draft.attrs[\"garment_id\"], image_status: \"pending\")","    end","","    # Attaches to the draft if it is still pending, else to the garment it became. Returns that garment, or nil.","    def attach(jpeg)","      file = -> { { io: StringIO.new(jpeg), filename: \"draft-#{@draft.id}.jpg\", content_type: \"image/jpeg\" } }","      @draft.with_lock do","        if @draft.pending?","          @draft.image.attach(**file.call)","          nil","        else","          garment = waiting_garment","          garment&.with_lock do","            unless garment.image.attached? && garment.image_status == \"ready\" # never overwrite a ready image","              garment.image.attach(**file.call)","              garment.update!(image_status: \"ready\")","            end","          end","          garment","        end","      end","    end","","    # Ready (with or without an image), batch progress updated, image area and progress broadcast.","    def finish(error: nil)","      draft = @draft || GarmentDraft.find_by(id: arguments.first)","      return unless draft","","      draft.with_lock { draft.update!(status: \"ready\", error: error) if draft.pending? }","      batch = draft.intake_batch","      update_progress(batch)","      broadcast(draft, batch)","      purge_source_batch_if_done","    end","","    def purge_source_batch_if_done","      batch = (@draft || GarmentDraft.find_by(id: arguments.first))&.intake_batch","      return unless batch&.source_file&.attached?","","      batch.with_lock do","        next unless batch.source_file.attached?","        next if batch.garment_drafts.exists?(status: \"pending\")","","        batch.source_file.purge_later","      end","    end","","    def update_progress(batch)","      drafts = batch.garment_drafts","      done = drafts.where.not(status: \"pending\").count","      total = drafts.count","      progress = ExtractGarmentsJob::DRAFTS_READY_PROGRESS +","                 ((100 - ExtractGarmentsJob::DRAFTS_READY_PROGRESS) * done / [ total, 1 ].max)","      batch.update!(progress: progress)","    end","","    def broadcast(draft, batch)","      stream = [ draft.user, :wardrobe ]","      Turbo::StreamsChannel.broadcast_replace_to(stream, target: ActionView::RecordIdentifier.dom_id(draft, :image),","                                                         partial: \"wardrobe/photo_intakes/draft_image\", locals: { draft: draft })","      Turbo::StreamsChannel.broadcast_replace_to(stream, target: ActionView::RecordIdentifier.dom_id(batch, :progress),","                                                         partial: \"wardrobe/photo_intakes/progress\", locals: { batch: batch })","    end","  end","end"],"lines":[null,null,2,null,null,null,null,null,2,2,null,3,null,2,null,2,1,1,null,7,2,1,null,2,null,2,40,38,2,2,null,null,36,36,1,1,null,null,35,null,null,null,null,null,null,26,26,26,26,null,null,2,null,null,2,10,null,8,null,null,nu .5).","  class ImportRemoteImageJob \u003c ApplicationJob","    queue_as :default","","    # One import per garment at a time; a ready image is never overwritten (same guards as image generation).","    limits_concurrency key: ->(garment_id, _url) { \"garment-image-#{garment_id}\" }, to: 1, duration: 5.minutes","","    ALLOWED_TYPES = %w[image/jpeg image/png image/webp].freeze","    MAX_BYTES = 10.megabytes","    TIMEOUT = 10","","    # Handlers declared later win, so the catch-all comes first.","    rescue_from(StandardError) do |error|","      finish(\"placeholder\")","      raise error","    end","    rescue_from(Media::UnsafeUrlError, Media::FetchError, Media::InvalidImageError, Vips::Error) do |error|","      Rails.logger.info(\"[Wardrobe::ImportRemoteImageJob] garment #{arguments.first}: #{error.class}\")","      finish(\"placeholder\")","    end","    retry_on Media::TransientFetchError, wait: :polynomially_longer, attempts: 3 do |job, error|","      Rails.logger.info(\"[Wardrobe::ImportRemoteImageJob] garment #{job.arguments.first}: gave up after #{error.class}\")","      job.send(:finish, \"placeholder\")","    end","    discard_on ActiveRecord::RecordNotFound","","    def perform(garment_id, image_url)","      @garment = Garment.find(garment_id)","      return if @garment.image.attached? && @garment.image_status == \"ready\"","","      image = Media::SafeFetcher.fetch(image_url, max_bytes: MAX_BYTES, timeout: TIMEOUT)","      Media::ImageNormalizer.sniff!(image.bytes, allowed: ALLOWED_TYPES)","      jpeg = Media::ImageNormalizer.to_square_jpeg(image.bytes, size: ENV.fetch(\"GARMENT_ASSET_SIZE\", 512).to_i)","","      attached = @garment.with_lock do","        next false if @garment.image.attached? && @garment.image_status == \"ready\"","","        @garment.image.attach(io: StringIO.new(jpeg), filename: \"garment-#{@garment.id}.jpg\", content_type: \"image/jpeg\")","        true","      end","      attached ? finish(\"ready\") : broadcast(@garment)","    end","","    private","","    def finish(status)","      garment = @garment || Garment.find_by(id: arguments.first)","      return unless garment","","      garment.update!(image_status: status)","      broadcast(garment)","    end","","    def broadcast(garment)","      Wardrobe::GarmentBroadcasts.image_changed(garment)","    end","  end","end"],"lines":[null,null,2,null,2,null,null,null,null,2,2,null,null,3,null,2,2,2,null,null,2,1,1,null,2,10,10,null,2,1,1,null,2,null,2,27,26,null,25,9,8,null,6,6,null,6,6,null,6,null,null,2,null,2,18,18,null,18,18,null,null,2,18,null,null,null],"lines_covered_percent":100.0,"covered_lines":37,"missed_lines":0,"omitted_lines":29,"total_lines":37},"app/jobs/wardrobe/purge_stale_drafts_job.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # Daily cleanup (design doc 5.3): removes intake batches with no activity for 24 hours (IntakeBatch.stale),","  # with their drafts and files. Committed drafts no longer hold images (Commit moves them to the garments),","  # so a garment's image is never touched.","  #","  # Each batch is locked (the same lock Commit takes) and checked again before it is removed, so a batch that","  # became active meanwhile is kept. A batch already gone is skipped, so running twice is harmless.","  class PurgeStaleDraftsJob \u003c ApplicationJob","    queue_as :default","","    def perform(now = Time.current)","      IntakeBatch.stale(now).find_each do |batch|","        batch.with_lock do","          batch.destroy! if IntakeBatch.stale(now).exists?(batch.id)","        end","      rescue ActiveRecord::RecordNotFound","        next # removed by someone else meanwhile","      end","    end","  end","end"],"lines":[null,null,2,null,null,null,null,null,null,2,2,null,2,9,8,7,null,null,1,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":8,"missed_lines":0,"omitted_lines":15,"total_lines":8},"app/mailers/application_mailer.rb":{"source":["class ApplicationMailer \u003c ActionMailer::Bas rror owns retries, so a POST is never repeated behind their back.","    class Vertex \u003c Client","      # Canonical google.rpc.Code names; anything else in error.status is ignored.","      GOOGLE_STATUS_CODES = %w[","        CANCELLED UNKNOWN INVALID_ARGUMENT DEADLINE_EXCEEDED NOT_FOUND ALREADY_EXISTS PERMISSION_DENIED","        RESOURCE_EXHAUSTED FAILED_PRECONDITION ABORTED OUT_OF_RANGE UNIMPLEMENTED INTERNAL UNAVAILABLE","        DATA_LOSS UNAUTHENTICATED","      ].freeze","      ENUM_FORMAT = /\\A[A-Z][A-Z0-9_]{0,63}\\z/","      # A 400 is a safety block only when an ErrorInfo detail's reason (an enum, not free text) names one.","      # The exact reasons Vertex uses are not documented for every model; verify with the first real calls.","      SAFETY_REASON = /(?:\\A|_)(?:SAFETY|RAI|RESPONSIBLE_AI|PROHIBITED_CONTENT|BLOCKLIST)(?:_|\\z)/","      ERROR_INFO_TYPE = \"type.googleapis.com/google.rpc.ErrorInfo\"","      # Gemini finish reasons that mean the output was withheld by a filter.","      # Garment images from a Gemini model must be one of these, decided from the bytes (the job normalizes them).","      GEMINI_GARMENT_IMAGE_TYPES = %w[image/png image/jpeg image/webp].freeze","      MAX_GENERATED_IMAGE_PIXELS = 50_000_000 # same bound as uploaded photos; Gemini returns ~1 MP","      PNG_SIGNATURE = \"\\x89PNG\\r\\n\\x1A\\n\".b","      GEMINI_BLOCKED_FINISH_REASONS = %w[","        SAFETY PROHIBITED_CONTENT BLOCKLIST SPII IMAGE_SAFETY IMAGE_PROHIBITED_CONTENT RECITATION","      ].freeze","","      def generate_json(kind:, prompt:, schema:, images: [], system: nil, user: nil,","                        temperature: 0.2, max_output_tokens: 2048)","        body = gemini_body(prompt: prompt, system: system, images: images, temperature: temperature,","                           max_output_tokens: max_output_tokens, json_schema: schema)","        post_gemini(kind: kind, model: vision_model, body: body, user: user, images_in: images.size) do |json|","          text = extract_text(json)","          parse_json_output(json, text)","        end","      end","","      def generate_text(kind:, prompt:, images: [], system: nil, user: nil,","                        temperature: 0.7, max_output_tokens: 512)","        body = gemini_body(prompt: prompt, system: system, images: images, temperature: temperature,","                           max_output_tokens: max_output_tokens)","        post_gemini(kind: kind, model: text_model, body: body, user: user, images_in: images.size) do |json|","          text = extract_text(json)","          raise ContentBlockedError, \"Gemini withheld the response (safety)\" if text.blank? && gemini_blocked?(json)","","          text","        end","      end","","      def grounded_text(kind:, prompt:, facts:, system: nil, user: nil, temperature: 0.7)","        check_quotas!(kind, user, 0, 0)","        attempt(kind: kind, model: grounded_model, user: user, input_chars: prompt.length) do |started|","          url = \"https://discoveryengine.googleapis.com/v1/projects/#{project_number}/locations/global:generateGroundedContent\"","          payload = {","            systemInstruction: system ? { parts: [ { text: system } ] } : nil,","            contents: [ { role: \"user\", parts: [ { text: prompt } ] } ],","            groundingSpec: {","              groundingSources: [ {","                inlineSource: {","                  groundingFacts: facts.map do |f|","                    { factText: f[:text] || f[\"text\"], attributes: { title: f[:title] || f[\"title\"] } }","                  end","                }","              } ]","            },","            generationSpec: { modelId: grounded_model, temperature: temperature }","          }.compact","          json = request_json(:post, url, payload)","          latency_ms = elapsed_ms(started)","          text = json.dig(\"candidates\", 0, \"content\", \"parts\", 0, \"text\").to_s","          log_call(kind: kind, model: grounded_model, status: \"ok\", latency_m def generate_gemini_image(kind:, prompt:, aspect_ratio:, user:, model:)","        check_disabled!(kind)","        check_quotas!(kind, user, 0, 1)","        body = {","          contents: [ { role: \"user\", parts: [ { text: prompt } ] } ],","          generationConfig: { responseModalities: %w[TEXT IMAGE], imageConfig: { aspectRatio: aspect_ratio } }","        }","        attempt(kind: kind, model: model, user: user, input_chars: prompt.length) do |started|","          json = request_json(:post, gemini_url(model), body)","          image = validated_garment_image(decode_gemini_image(json))","          log_call(kind: kind, model: model, status: \"ok\", latency_ms: elapsed_ms(started), user: user,","                   input_chars: prompt.length, images_out: 1)","          image","        end","      end","","      # The first inlineData part of a Gemini response, with its MIME type. Text parts are ignored. No image:","      # ContentBlockedError when the response carries a safety indicator, else InvalidResponseError.","      def decode_gemini_image(json)","        content = first_candidate(json)&.fetch(\"content\", nil)","        parts = content.is_a?(Hash) && content[\"parts\"].is_a?(Array) ? content[\"parts\"] : []","        inline = parts.lazy.filter_map { _1[\"inlineData\"] if _1.is_a?(Hash) && _1[\"inlineData\"].is_a?(Hash) }.first","        unless inline","          raise ContentBlockedError, \"Gemini withheld the image (safety)\" if gemini_blocked?(json)","","          raise InvalidResponseError, \"No image in response\"","        end","","        data = inline[\"data\"]","        raise InvalidResponseError, \"Gemini image data is missing\" unless data.is_a?(String) && data.present?","","        bytes = begin","          Base64.strict_decode64(data)","        rescue ArgumentError","          raise InvalidResponseError, \"Gemini image data is not valid base64\"","        end","        mime = inline[\"mimeType\"]","        Ai::Image.new(bytes: bytes, mime_type: mime.is_a?(String) && mime.match?(%r{\\Aimage/[\\w.+-]+\\z}) ? mime : \"image/png\")","      end","","      # The image a Gemini garment call returned, checked before the call counts as a success: the type comes from","      # the bytes (PNG, JPEG or WebP; the declared mimeType is not trusted), and every pixel is decoded with","      # fail_on: :error, which rejects truncated files. PNG chunk checksums are checked here first, because","      # whether libvips does depends on its PNG decoder (libpng rejects bad CRCs; libspng, used by Ubuntu's","      # libvips 8.15, ignores them). Corruption inside JPEG or WebP data has no checksum and can decode to wrong","      # pixels; nothing short of looking at the image detects that.","      # Not resized here: the jobs normalize to GARMENT_ASSET_SIZE.","      def validated_garment_image(image)","        require \"vips\"","        mime = Media::ImageNormalizer.sniff!(image.bytes, allowed: GEMINI_GARMENT_IMAGE_TYPES)","        if mime == \"image/png\" && !png_chunks_intact?(image.bytes)","          raise InvalidResponseError, \"Gemini returned a PNG with corrupt data\"","        end","","        decoded = Vips::Image.new_from_buffer(image.bytes, \"\", fail_on: :error)","        if decoded.width * decoded.height > MAX_GENERATED_IMAGE_PIXELS","          raise InvalidResponseError, \"Gemini returned an image larger than #{MAX_GENERATED_IMAGE_PIXELS} pixels\"","        end","","        decoded.avg # decodes every pixel; raises Vips::Error on truncated or corrupt data","        Ai::Image.new(bytes: image.bytes, mime_type: mime)","      rescue Media::InvalidImageError","        raise InvalidResponseError, \"Gemini returned data that is not a PNG, JPEG or WebP image\"","      rescue Vips::Error","        raise InvalidResponseError, \"Gemini returned an image that could not be decoded\"","      end","","      # Every chunk, from the signature to IEND, is complete and matches its CRC-32.","      def png_chunks_intact?(bytes)","        re 2 then [ 2, 1 ]","      else        [ 2, 2 ]","      end","    end","","    def draw_cell(canvas, item, x, y, w, h)","      # white background","      bg = Vips::Image.black(w, h, bands: 3).linear([ 1, 1, 1 ], [ 255.0, 255.0, 255.0 ])","      canvas = canvas.composite2(bg.cast(:uchar), :over, x: x, y: y)","","      # garment image","      bytes = garment_bytes(item)","      if bytes","        img = Vips::Image.new_from_buffer(bytes, \"\").thumbnail_image(w - 4, height: h - 20, size: :down, crop: :none, kernel: :lanczos3)","        ix = x + (w - img.width) / 2","        iy = y + 2","        canvas = canvas.composite2(img.cast(:uchar), :over, x: ix, y: iy)","      end","","      # label","      label = item.name.to_s.truncate(MAX_LABEL_LEN)","      begin","        txt = Vips::Image.text(label, font: \"sans #{LABEL_SIZE}\", rgba: false)","        txt = txt.linear([ 1, 1, 1 ], LABEL_COLOR.map(&:to_f))","        lx = x + [ 0, (w - txt.width) / 2 ].max","        ly = y + h - LABEL_SIZE - 4","        canvas = canvas.composite2(txt.cast(:uchar), :over, x: lx, y: ly)","      rescue StandardError","        # label rendering failure is non-fatal","      end","","      canvas","    rescue StandardError","      canvas","    end","","    def garment_bytes(item)","      if item.respond_to?(:image) && item.image.attached?","        item.image.download","      end","    rescue StandardError","      nil","    end","  end","end"],"lines":[null,null,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,null,2,9,null,null,2,9,9,null,null,2,9,36,null,9,9,9,null,9,null,null,2,null,2,9,null,4,4,4,4,4,null,0,null,null,2,9,9,null,4,null,null,2,9,null,6,6,6,null,6,12,12,12,12,12,null,null,6,null,null,2,6,2,3,1,null,null,null,2,null,12,12,null,null,0,0,0,0,0,0,null,null,null,0,null,0,0,0,0,0,null,null,null,null,0,null,12,null,null,2,0,0,null,null,0,null,null,null],"lines_covered_percent":78.2051282051282,"covered_lines":61,"missed_lines":17,"omitted_lines":47,"total_lines":78},"app/services/avatars/prompt_builder.rb":{"source":["# frozen_string_literal: true","","module Avatars","  class PromptBuilder","    MAX_PROMPT_CHARS = ENV.fetch(\"IMAGE_GEN_MAX_PROMPT_CHARS\", 10_000).to_i","","    SUBJECT_LINES = {","      \"female\" => \"Illustrated head-and-shoulders portrait of exactly one adult woman, character illustration with soft shading, plain off-white background, not a photograph.\",","      \"male\"   => \"Illustrated head-and-shoulders portrait of exactly one adult man, character illustration with soft shading, plain off-white background, not a photograph.\",","      \"other\"  => \"Illustrated head-and-shoulders portrait of exactly one adult person, inclusive non-stereotypical look, character illustration with soft shading, plain off-white background, not a photograph.\",","      nil      => \"Illustrated head-and-shoulders portrait of exactly one adult person matching the facial description below, character illustration with soft shading, plain off-white background, not a photograph.\"","    }.freeze","","    GENDER_CLAUSES = {","      \"female\" => \"Portrait subject is an adult female: keep feminine facial structure; do not render as male or masculine-presenting unless the description clearly indicates otherwise.\",","      \"male\"   => \"Portrait subject is an adult male: keep masculine facial structure, jaw, and brow; short or styled male-typical hair unless the hair description below says otherwise; do not render as female or feminine-presenting.\",","      \"other\"  => \"Portrait subject is an adult with inclusive, non-stereotypical or androgynous presentation; avoid defaulting to hyper-feminine or hyper-masculine stock character looks.\",","      nil      => \"Match apparent gender presentation and age from the facial description only; do not substitute a different gender presentation.\"","    }.freeze","","    ANTI_STOCK = \"A single distinctive individual with natural asymmetry; avoid generic stock clipart, corporate vector templates, beauty-app default faces, and symmetrical influencer glam.\"","    ANTI_STOCK_MALE_APPEND = \" No red lipstick, no winged eyeliner, no glamour makeup or long feminine lashes unless clearly matching the reference description.\"","","    def self.portrait(description:, context:)","      new(description: description, context: context).build","    end","","    def initialize(description:, context:)","      @description = description","      @context = context","    end","","    def build","      parts = []","","      parts \u003c\u003c SUBJECT_LINES[@context.gender]","","      if @description.present?","        parts \u003c\u003c \"PRIMARY facial reference from the user's photo — the illustration MUST reflect these traits (interpret as stylised art, not a photo): #{@description}\"","      end","","      parts \u003c\u003c GENDER_CLAUSES[@context.gender]","","      if @context.skin_tone.present?","        parts \u003c\u003c \"User skin tone preference for the illustration: #{@context.skin_tone.to_s.gsub('_', ' ')}.\"","      end","","      hair_part = build_hair_part","      parts \u003c\u003c hair_part if hair_part","","      if @context.body_type.present?","        parts \u003c\u003c \"Body type: #{@context.body_type} build.\"","      end","","      if %w[warm cool neutral].include?(@context.color_tone.to_s)","        parts \u003c\u003c \"Overall colour palette: #{@context.color_tone} tones.\"","      end","","      anti_stock = ANTI_STOCK.dup","      anti_stock += ANTI_STOCK_MALE_APPEND if @context.gender == \"male\"","      parts \u003c\u003c anti_stock","","      parts \u003c\u003c \"Square crop, centred composition, single face only.\"","","      parts.compact.join(\" \").truncate(MAX_PROMPT_CHARS, omission: \"\")","    end","","    private","","    def build_hair_part","      style = @context.hair_style.presence","      color = @context.hair_color.presence","","      if style && color","        \"User hair preference: #{color.gsub('_', ' ')} colour, #{style.gsub('_', ' ')} style — align with the photo description when both apply.\"","      elsif style","        \"User hair style preference: #{style.gsub('_', ' ')}.\"","      elsif color","        \"User hair colour preference: #{color.gsub('_', ' ')}.\"","      end","    end","  end","end"],"lines":[null,null,2,2,2,null,2,null,null,null,null,null,null,2,null,null,null,null,null,null,2,2,null,2,21,null,null,2,21,21,null,null,2,21,null,21,null,21,4,null,null,21,null,21,1,null,null,21,21,null,21,1,null,null,21,2,null,null,21,21,21,null,21,null,21,null,null,2,null,2,21,21,null,21,1,20,1,19,1,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":41,"missed_lines":0,"omitted_lines":42,"total_lines":41},"app/services/avatars/prompts.rb":{"source":["# frozen_string_literal: true","","module Avatars","  module Prompts","    SELFIE = \u003c\u003c~PROMPT.strip","      You are helping build an illustrated avatar from a selfie. Study the face and head closely.","","      Write a detailed, factual description in plain prose. Aim for roughly 150–400 words. Cover everything clearly visible:","      • Face shape, overall proportions, forehead height, cheek volume.","      • Eyebrows: thickness, arch, distance from eyes.","      • Eyes: shape, size, spacing, eyelid shape, visible iris colour if discernible, under-eye area.","      • Nose: bridge width, length, tip shape, nostril visibility.","      • Mouth and lips: width, upper/lower lip fullness, resting expression.","      • Jaw, chin, and neck (if visible): angles, width, chin shape.","      • Ears: only if visible — size, angle, prominence.","      • Skin: tone and undertone hints, texture or sheen (neutral, observational wording).","      • Facial hair: clean-shaven, stubble, beard, or mustache — coverage, shape, density.","      • Hair: hairline, density, length, how it falls, colour (including gray if visible).","      • Face-framing accessories: glasses, hat brim, etc., if present.","      • Approximate apparent age band (e.g. late twenties, forties) — structural only.","","      Rules: Use neutral structural language. Do not name the person or guess their identity, job, or ethnicity labels. Do not describe clothing below the collar or the background. Do not refuse; describe only what you can see.","    PROMPT","","    def self.outfit_subject(outfit_desc:)","      \"Full body fashion illustration of person [1] wearing #{outfit_desc}. Show the complete outfit from head to toe, person standing upright facing forward. All clothing items clearly visible. Character illustration style, plain off-white background.\"","    end","","    def self.outfit_gemini(outfit_desc:, n_garment_images:)","      \"You are an AI fashion illustrator. The FIRST image is an illustrated avatar portrait — study this person's face, hair style, hair colour, skin tone, and facial features carefully. The next #{n_garment_images} image(s) are clothing items: #{outfit_desc}. Generate a single full-body illustrated image of the SAME character from the first image wearing ALL of the clothing items shown. Preserve the character's face, hair and skin tone exactly as in the portrait. Show every garment item clearly. Full body, head to toe, forward-facing pose. Same illustration style as the portrait. Plain off-white background.\"","    end","  end","end"],"lines":[null,null,2,2,2,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,2,1,null,null,2,0,null,null,null],"lines_covered_percent":85.71428571428571,"covered_lines":6,"missed_lines":1,"omitted_lines":26,"total_lines":7},"app/services/avatars/selfie_upload.rb":{"source":["# frozen_string_literal: true","","module Avatars","  class SelfieUpload","    MAX_SIZE = 15.megabytes","","    Result = Data.define(:ok, :error)","","    def self.accept(file)","      if file.blank?","        return Result.new(ok: false, error: \"Uploaded file is empty\")","      end","","      if file.size > MAX_SIZE","        return Result.new(ok: false, error: \"Image too large\")","      end","","      begin","        Media::ImageNormalizer.sniff!(file.read(64.kilobytes))","        file.rewind","      rescue Media::InvalidImageError","        return Result.new(ok: false, error: \"Please upload a JPEG, PNG, WebP or HEIC image\")","      end","","      Result.new(ok: true, error: nil)","    end","","    def self.enqueue!(profile, file)","      profile.pending_selfie.attach(file)","      profile.update!(avatar_status: \"pending\")","      Avatars::GenerateAvatarJob.perform_later(profile.id)","    end","  end","end"],"lines":[null,null,2,2,2,null,2,null,2,6,1,null,null,5,1,null,null,null,4,3,null,1,null,null,3,null,null,2,2,2,2,null,null,null],"lines_covered_percent":100.0,"covered_lines":17,"missed_lines":0,"omitted_lines":17,"total_lines":17},"app/services/media/fetch_error.rb":{"source":["# frozen_string_literal: true","","module Media","  # A safe URL that could not be downloaded: HTTP error, timeout, network failure or a body over the limit.","  # One class per file so Rails autoloads it wherever it is first referenced.","  class FetchError \u003c ApplicationError; end","end"],"lines":[null,null,2,null,null,2,null],"lines_covered_percent":100.0,"covered_lines":2,"missed_lines":0,"omitted_lines":5,"total_lines":2},"app/services/media/image_normalizer.rb":{"source":["# frozen_string_literal: true","","module Media","  # Errors live in their own files (app/services/media/*_error.rb) so they autoload on first use.","  class ImageNormalizer","    ALLOWED = %w[image/jpeg image/png image/webp image/heic].freeze","","    def self.sniff!(bytes, allowed: ALLOWED)","      mime = Marcel::MimeType.for(StringIO.new(bytes))","      heic_ok = ActiveModel::Type::Boolean.new.cast(ENV.fetch(\"HEIC_SUPPORTED\", \"true\"))","      allowed = allowed - [ \"image/heic\" ] unless heic_ok","      raise InvalidImageError.new(\"Unsupported image type\") unless allowed.include?(mime)","","      mime","    end","","    def self.to_jpeg(bytes)","      sniff!(bytes)","      require \"vips\"","      image = Vips::Image.new_from_buffer(bytes, \"\")","      image = image.colourspace(:srgb) if image.bands == 4","      image.jpegsave_buffer(Q: 92)","    end","","    def self.to_square_jpeg(bytes, size: 512, background: \"#ffffff\")","      sniff!(bytes)","      require \"vips\"","      image = Vips::Image.new_from_buffer(bytes, \"\")","      scale = [ size.to_f / image.width, size.to_f / image.height ].min","      resized = image.resize(scale)","      canvas = Vips::Image.black(size, size).bandjoin([ size, size ]).bandjoin([ size, size ])","      canvas = canvas.new_from_image([ 255, 255, 255 ]) if background == \"#ffffff\"","      x = ((size - resized.width) / 2.0).round","      y = ((size - resized.height) / 2.0).round","      composed = canvas.composite(resized, :over, x: x, y: y)","      composed.jpegsave_buffer(Q: 92)","    end","  end","end"],"lines":[null,null,2,null,2,2,null,2,211,211,211,211,null,199,null,null,2,3,3,3,3,3,null,null,2,55,55,55,54,54,54,54,54,54,54,54,null,null,null],"lines_covered_percent":100.0,"covered_lines":27,"missed_lines":0,"omitted_lines":12,"total_lines":27},"app/services/media/invalid_image_error.rb":{"source":["# frozen_string_literal: true","","module Media","  # Bytes that are not an allowed image type (checked by content, not by name or header).","  # One class per file so Rails autoloads it wherever it is first referenced.","  class InvalidImageError \u003c ApplicationError; end","end"],"lines":[null,null,2,null,null,2,null],"lines_covered_percent":100.0,"covered_lines":2,"missed_lines":0,"omitted_lines":5,"total_lines":2},"app/services/media/safe_fetcher.rb":{"source":["# frozen_string_literal: true","","module Media","  # Fetches a user-influenced URL (e.g. a search result image) without letting it reach internal services","  # (design doc 4.4). Every hop, including redirects, must:","  # - use http or https on the default port, with no credentials in the URL;","  # - not name a blocked metadata host;","  # - resolve only to public addresses. ssrf_filter checks the IPs and connects to the vetted IP, so a","  #   second DNS answer (rebinding) cannot redirect the connection.","  # The response must be 2xx and is read in chunks under a byte limit and an overall deadline.","  # The caller still checks the bytes are an image (Media::ImageNormalizer.sniff!).","  #","  #   Media::SafeFetcher.fetch(url, max_bytes: 10.megabytes, timeout: 10) # => Ai::Image(bytes, mime_type)","  #   raises Media::UnsafeUrlError (never fetched) or Media::FetchError (could not download); the subclass","  #   Media::TransientFetchError marks failures worth retrying (timeouts, network errors, HTTP 408/429/5xx)","  class SafeFetcher","    BLOCKED_HOSTS = %w[metadata.google.internal metadata.azure.com 100.100.100.200].freeze","    ALLOWED_PORTS = { \"http\" => 80, \"https\" => 443 }.freeze","    MAX_REDIRECTS = 3","    RETRYABLE_STATUSES = [ 408, 429 ].freeze # plus every 5xx","    USER_AGENT = \"misfitAI-image-import/1.0\"","","    # Network failures that mean \"could not download\", not \"unsafe\".","    NETWORK_ERRORS = [","      Timeout::Error, Net::OpenTimeout, Net::ReadTimeout, Net::WriteTimeout, SocketError, SystemCallError,","      IOError, EOFError, OpenSSL::SSL::SSLError, Net::HTTPBadResponse, Zlib::Error","    ].freeze","","    # DNS lookup used for every hop. Tests replace it so no real DNS is used.","    cattr_accessor :resolver, default: SsrfFilter::DEFAULT_RESOLVER","","    def self.fetch(url, max_bytes: 10.megabytes, timeout: 10)","      new(max_bytes: max_bytes, timeout: timeout).fetch(url)","    end","","    def initialize(max_bytes:, timeout:)","      @max_bytes = max_bytes","      @timeout = timeout","    end","","    def fetch(url)","      uri = parse_uri!(url)","      check_uri!(uri)","      deadline = monotonic_now + @timeout","      body = +\"\".b","      response = SsrfFilter.get(","        uri.to_s,","        max_redirects: MAX_REDIRECTS,","        resolver: method(:resolve),","        headers: { \"User-Agent\" => USER_AGENT, \"Accept\" => \"image/*\" },","        request_proc: ->(request) { check_uri!(request.uri) }, # redirect hops too","        http_options: { open_timeout: @timeout, read_timeout: @timeout, write_timeout: @timeout }","      ) { |res| read_body(res, body, deadline) }","","      unless response.is_a?(Net::HTTPSuccess)","        error = retryable_status?(response.code.to_i) ? TransientFetchError : FetchError","        raise error.new(\"Couldn't download that image.\", \"HTTP #{response.code}\")","      end","","      Ai::Image.new(bytes: body, mime_type: Marcel::MimeType.for(StringIO.new(body)))","    rescue SsrfFilter::TooManyRedirects, SsrfFilter::UnresolvedHostname => e","      raise FetchError.new(\"Couldn't download that image.\", e.class.name)","    rescue SsrfFilter::Error => e","      raise UnsafeUrlError.new(\"URL is not allowed\", e.class.name)","    rescue *NETWORK_ERRORS => e","      raise TransientFetchError.new(\"Couldn't download that image.\", e.class.name)","    end","","    private","","    def parse_uri!(url)","      raise UnsafeUrlError.new(\"Invalid URL\") unless url.is_a?(String) && url.match?(%r{\\Ahttps?://}i)","","      URI.parse(url)","    rescue URI::InvalidURIError","      raise UnsafeUrlError.new(\"Invalid URL\")","    end","","    def check_uri!(uri)","      raise UnsafeUrlError.new(\"URL is not allowed\", \"scheme\") unless ALLOWED_PORTS.key?(uri.scheme.to_s.downcase)","      raise UnsafeUrlError.new(\"URL is not allowed\", \"credentials\") if uri.userinfo.present?","      raise UnsafeUrlError.new(\"URL is not allowed\", \"port\") unless uri.port == ALLOWED_PORTS[uri.scheme.downcase]","      raise UnsafeUrlError.new(\"URL is not allowed\", \"host\") if uri.hostname.blank?","    end","","    def resolve(hostname)","      raise UnsafeUrlError.new(\"URL is not allowed\", \"blocked host\") if BLOCKED_HOSTS.include?(hostname.to_s.downcase.chomp(\".\"))","","      resolver.call(h source: \"google\", synced_at: Time.current)","      @user.update!(google_calendar_connected_at: @user.google_calendar_connected_at || Time.current)","      broadcast_week_plan!","      broadcast_status!(SUCCESS_MESSAGE, tone: :notice)","      true","    end","","    def refresh_token!(force: false)","      return false if @user.google_refresh_token.blank?","      return true if !force && @user.google_token_expires_at.present? && @user.google_token_expires_at > 60.seconds.from_now","","      client = Signet::OAuth2::Client.new(","        client_id: ENV.fetch(\"GOOGLE_CLIENT_ID\", \"\"),","        client_secret: ENV.fetch(\"GOOGLE_CLIENT_SECRET\", \"\"),","        token_credential_uri: \"https://oauth2.googleapis.com/token\",","        refresh_token: @user.google_refresh_token","      )","      client.fetch_access_token!","      @user.update!(","        google_access_token: client.access_token,","        google_token_expires_at: Time.current + client.expires_in.to_i.seconds","      )","      true","    rescue Signet::AuthorizationError","      false","    end","","    def calendar_service","      service = Google::Apis::CalendarV3::CalendarService.new","      service.authorization = @user.google_access_token # read each call: a retry uses the refreshed token","      service","    end","","    def list_calendar_events","      tz = @user.time_zone","      calendar_service.list_events(","        \"primary\",","        time_min: @week_start.in_time_zone(tz).beginning_of_day.iso8601,","        time_max: (@week_start + 6).in_time_zone(tz).end_of_day.iso8601,","        single_events: true,","        order_by: \"startTime\",","        max_results: 250","      ).items || []","    end","","    def apply_events!(items)","      week = @week_start..(@week_start + 6)","      # Start-time order, Google's order breaking ties, so the first event wins a same-priority tie (6.7 step 6).","      by_date = items.each_with_index.filter_map do |item, index|","        date, starts_at = event_date_and_start(item)","        [ date, starts_at, index, item ] if date && week.cover?(date)","      end.sort_by { |_date, starts_at, index, _item| [ starts_at, index ] }.group_by(&:first)","","      week.each do |date|","        day_items = (by_date[date] || []).map(&:last)","        classified = day_items.map { [ _1, EventClassifier.call(_1.summary) ] }","        winner = classified.reduce(nil) do |best, pair|","          best.nil? || EventClassifier.priority(pair.last) > EventClassifier.priority(best.last) ? pair : best","        end","","        event = @plan.week_events.find_or_initialize_by(date:)","        event.event_type = winner&.last || \"none\"","        event.original_summary = winner&.first&.summary&.to_s","        event.save!","        replace_calendar_events!(event, classified)","      end","    end","","    # Issue #8: keep every event of the day so the planner can split it into time blocks.","    def replace_calendar_events!(week_event, classified)","      week_event.calendar_events.delete_all","      rows = classified.each_with_index.map do |(item, type), position|","        all_day = item.start&.date.present?","        {","          week_event_id: week_event.id, summary: item.summary.to_s, event_type: type, position:, all_day:,","          location: item.location.presence,","          starts_at: all_day ? nil : item.start.date_time.in_time_zone(@user.time_zone),","          ends_at: all_day ? nil : item.end&.date_time&.in_time_zone(@user.time_zone)","        }","      end","      CalendarEvent.insert_all!(rows) if rows.any?","    end","","    # 6.7 step 4: all-day events use start.date; timed events use the start time in the user's zone.","    def event_date_and_start(item)","      tz = @user.time_zone","      if item.start&.date.present?","        date = item.start.date.to_date","        [ date, date.in_time_zone(tz) ]","      elsif item.start&.date_time.present?","        starts_at = item.start.date_time.in_time_zone(tz)","        [ starts_at.to_date, starts_at ]","      end","    end","","    def reconnect!","      Rails.logger.info(\"Calendar sync: user #{@user.id} needs Google reconnect\")","      @user.update!(google_access_token: nil, google_refresh_token: nil, google_token_expires_at: nil)","      broadcast_status!(RECONNECT_MESSAGE, tone: :alert)","      false","    end","","    def broadcast_week_plan!","      Turbo::StreamsChannel.broadcast_replace_to(","        [ @user, :planner ],","        target: \"week_plan\",","        partial: \"week_plans/week_plan\",","        locals: { week_plan: @plan }","      )","    end","","    def broadcast_status!(message, tone:)","      Turbo::StreamsChannel.broadcast_update_to(","        [ @user, :planner ],","        target: \"calendar_sync_status\",","        partial: \"week_plans/sync_status\",","        locals: { message:, tone: }","      )","    end","  end","end"],"lines":[null,null,2,2,null,2,null,null,2,2,2,2,null,2,28,null,null,2,28,null,27,27,27,null,null,24,null,null,2,null,2,null,null,1,null,1,1,1,null,null,2,null,2,26,22,22,22,22,22,22,null,null,2,29,28,null,5,null,null,null,null,null,5,3,null,null,null,3,null,2,null,null,2,26,26,26,null,null,2,26,26,null,null,26,null,null,null,null,null,null,2,22,null,22,36,36,35,null,22,154,189,154,35,null,null,154,154,154,154,154,null,null,null,null,2,154,154,35,null,35,null,35,35,null,null,154,null,null,null,2,36,36,4,4,32,32,32,null,null,null,2,4,4,4,4,null,null,2,22,null,null,null,null,null,null,null,2,27,null,null,null,null,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":87,"missed_lines":0,"omitted_lines":79,"total_lines":87},"app/services/planner/day_segmenter.rb":{"source":["# frozen_string_literal: true","","module Planner","  # One outfit's time block within a day (issue #8). Responds to #date and #event_type like a WeekEvent, so the","  # recommendation engine can take segments in place of days. #chain, when set, overrides the formality chain.","  Segment = Data.define(:date, :index, :event_type, :chain, :starts_at, :ends_at, :label, :change_reason,","                        :summaries)","","  # Splits a day's calendar events into as few outfits as possible (issue #8). Pure: no DB, no time dependence.","  #","  # - Zero or one timed event: one segment of the day's type, exactly the pre-#8 behaviour.","  # - Consecutive events share an outfit when their types are compatible: the same type, or casual next to anything.","  # - A work meeting and a date night share one smart-casual outfit when the wardrobe has one","  #   (smart_casual_ready:); otherwise the user changes before dinner.","  # - Gym next to a work meeting or a date night always means a change.","  # - All-day events set the day's type (via the week_event) but never open a block of their own.","  class DaySegmenter","    MAX_SEGMENTS = 3","    WORK_TO_DINNER = %w[date_night work_meeting].freeze","    SHARED_WORK_DINNER_CHAIN = [ %w[smart_casual], %w[formal business], %w[casual] ].freeze","","    Block = Struct.new(:events, :change_reason) do","      def type","        events.map(&:event_type).max_by.with_index { |t, i| [ EventClassifier.priority(t), -i ] }","      end","    end","","    # time_zone: the user's zone, for labels and change reasons (stored times come back in UTC).","    def self.call(week_event:, calendar_events:, smart_casual_ready:, time_zone:)","      new(week_event:, calendar_events:, smart_casual_ready:, time_zone:).call","    end","","    def initialize(week_event:, calendar_events:, smart_casual_ready:, time_zone:)","      @day = week_event","      @zone = ActiveSupport::TimeZone[time_zone] || raise(ArgumentError, \"unknown time zone #{time_zone.inspect}\")","      @timed = calendar_events.select(&:timed?).sort_by { [ _1.starts_at, _1.position ] }","      @smart_casual_ready = smart_casual_ready","    end","","    def call","      return [ single_segment ] if @timed.size \u003c= 1","","      blocks = cap(build_blocks)","      return [ single_segment(events: @timed) ] if blocks.size == 1 && !shared_work_dinner?(blocks.first)","","      blocks.each_with_index.map { |block, index| segment_for(block, index) }","    end","","    private","","    def build_blocks","      @timed.each_with_object([]) do |event, blocks|","        current = blocks.last","        if current && compatible?(current.type, event.event_type)","          current.events \u003c\u003c event","        else","          blocks \u003c\u003c Block.new([ event ], current && change_reason(current, event))","        end","      end","    end","","    def compatible?(block_type, type)","      return true if block_type == type || \"casual\".in?([ block_type, type ])","      return @smart_casual_ready if [ block_type, type ].sort == WORK_TO_DINNER","","      false","    end","","    # More blocks than outfits anyone would change into: fold the last ones together.","    def cap(blocks)","      while blocks.size > MAX_SEGMENTS","        last = blocks.pop","        blocks.last.events.concat(last.events)","      end","      blocks","    end","","    def shared_work_dinner?(block)","      (WORK_TO_DINNER - block.events.map(&:event_type)).empty?","    end","","    def segment_for(block, index)","      first = block.events.first","      Segment.new(","        date: @day.date, index:, event_type: block.type,","        chain: shared_work_dinner?(block) ? SHARED_WORK_DINNER_CHAIN : nil,","        starts_at: first.starts_at, ends_at: block.events.filter_map(&:ends_at).max,","        label: label_for(block.events), change_reason: block.change_reason,","        summaries: block.events.map(&:summary)","      )","    end","","    def single_segment(events: @timed)","      Segment.new(","        date: @day.date, index: 0, event_type: @day.event_type, chain: nil,","        starts_at: events.first&.starts_at, ends_at: events.filter_map(&:ends_at).max,","        label: events.size > 1 ? label_for(events) : nil, change_reason: nil,","        summaries: events.map(&:summary)","      )","    end","","    def label_for(events)","      more = events.size > 1 ? \" + #{events.size - 1} more\" : \"\"","      \"#{part_of_day(local(events.first.starts_at))}: #{events.first.summary}#{more}\"","    end","","    def local(time) = time.in_time_zone(@zone)","","    def part_of_day(time)","      if time.hour \u003c 12 then \"Morning\"","      elsif time.hour \u003c 17 then \"Afternoon\"","      else \"Evening\"","      end","    end","","    def change_reason(previous, event)","      at = \"#{event.summary} at #{local(event.starts_at).strftime('%-l:%M %p').strip}\"","      if event.event_type == \"gym\"","        \"Change into workout clothes for #{at}.\"","      elsif previous.type == \"gym\"","        \"Change after your workout: gym pieces don't suit #{at}.\"","      elsif previous.type == \"work_meeting\" && event.event_type == \"date_night\"","        \"Change before #{at}: work pieces are more formal than an evening out calls for.\"","      else","        \"Change for #{at}.\"","      end","    end","  end","end"],"lines":[null,null,2,null,null,2,null,null,null,null,null,null,null,null,null,null,2,2,2,2,null,2,2,100,null,null,null,null,2,231,null,null,2,231,231,262,230,null,null,2,230,null,12,12,null,31,null,null,2,null,2,12,29,29,4,null,25,null,null,null,null,2,17,14,null,12,null,null,null,2,12,2,2,null,12,null,null,2,24,null,null,2,21,21,null,21,null,null,null,null,null,null,2,220,null,null,220,null,null,null,null,2,23,23,null,null,2,null,2,23,4,3,null,null,null,2,13,13,4,9,8,1,1,null,0,null,null,null,null],"lines_covered_percent":98.41269841269842,"covered_lines":62,"missed_lines":1,"omitted_lines":66,"total_lines":63},"app/services/planner/day_suggestion.rb":{"source":["# frozen_string_literal: true","","module Planner","  DaySuggestion = Data.define(:date, :event_type, :top, :bottom, :dress, :outerwear, :shoes)","end"],"lines":[null,null,2,2,null],"lines_covered_percent":100.0,"covered_lines":2,"missed_lines":0,"omitted_lines":3,"total_lines":2},"app/serv d shirt\", \"pencil skirt\", \"stiletto\", \"pump\" ].freeze","    GYM_DRESS_SHOE_RE = /\\b(heels?|pumps?|stilettos?|oxfords?|loafers?)\\b/i","    SUIT_WORD_RE      = /\\bsuit\\b/i","","    SIZE_BANDS = [ %w[xxs 00 0], %w[xs 2 4 6], %w[s small 8 10], %w[m medium 12 14], %w[l large 16 18],","      %w[xl x-large 20 22], %w[xxl 2xl 24 26], %w[xxxl 3xl 28 30] ].map(&:to_set).freeze","","    WARM_COLORS = %w[red orange yellow gold amber coral rust terracotta brown beige tan camel sand cream","      ivory olive mustard peach salmon].to_set","    COOL_COLORS = %w[blue navy indigo violet purple lilac lavender teal cyan turquoise mint green sage","      emerald grey gray silver white black].to_set","    COLOR_MATCH_BONUS   = 0.5","    COLOR_AVOID_PENALTY = -2.0","    COLOR_TONE_BONUS    = 0.2","","    STRUCTURED_TOP_RE = /\\b(blazer|sport coat|suit jacket|suit coat|double-breasted|peacoat)\\b/i","    DRESS_SHOE_RE     = /\\b(heel|pump|stiletto|oxford|loafer|wingtip|brogue)s?\\b/i","    OUTERWEAR_EVENTS  = %w[work_meeting casual].to_set","","    # events: anything with #date and #event_type, in order: WeekEvents (one outfit per day) or","    # Planner::Segments (issue #8, one outfit per time block; a segment's #chain overrides the formality chain).","    # recently_worn_ids: garment ids the user confirmed wearing lately; they lose ties to unworn pieces.","    def self.call(garments:, events:, context:, recently_worn_ids: Set.new, forecasts: {})","      new(garments:, events:, context:, recently_worn_ids:, forecasts:).call","    end","","    def initialize(garments:, events:, context:, recently_worn_ids: Set.new, forecasts: {})","      @garments = garments","      @events = events","      @context = context","      @recently_worn = recently_worn_ids.to_set","      @avoid_words = color_word_set(@context.avoided_colors)","      @fav_words = color_word_set(@context.favorite_colors)","      @tone = @context.color_tone&.to_s&.downcase","      @forecasts = forecasts","    end","","    def call","      pool  = apply_gender_filter(@garments).reject(&:hidden_from_recommendations)","      label = size_label(@context.measurements)","      used  = Set.new","","      @events.each_with_index.map do |event, day_index|","        weather = @forecasts[event.date]","        displayed = event.event_type","        type      = displayed == \"none\" ? \"casual\" : displayed","        chain     = (event.chain if event.respond_to?(:chain)) || FORMALITY_CHAINS.fetch(type, FALLBACK_CHAIN)","        gym       = type == \"gym\" ? method(:gym_allowed?) : nil","        tiebreak  = type == \"work_meeting\" ? ->(g) { structured_jacket?(g) ? 1 : 0 } : nil","","        top = bottom = dress = nil","        if type == \"date_night\"","          dress = pick(pool, method(:dress?), chain, used:, event_type: type, label:, allow_reuse: false)","        end","","        unless dress","          top    = pick(pool, method(:top?), chain, used:, event_type: type, label:, extra: gym, tiebreak:)","          bottom = pick(pool, method(:bottom?), chain, used:, event_type: type, label:, extra: gym)","          if top.nil? || bottom.nil?","            fallback = pick(pool, method(:dress?), chain, used:, event_type: type, label:, extra: gym)","            if fallback","              dress = fallback","              top = bottom = nil","            end","          end","        end","","        [ top, bottom, dress ].compact.each { used \u003c\u003c _1.id }","","        outerwear = pick_outerwear(pool, top:, displayed:, day_index:)","        if weather","          temp = (weather[:temp_f] || weather[:temp]).to_i","          outerwear = nil if temp > 80","          outerwear ||= pool.select { |g| g.category == \"outerwear\" }.first if temp \u003c 60","        end","        shoes     = pick_shoes(pool, type:, chain:, label:, used:)","","        DaySuggestion.new(","          date: event.date, event_type: displayed, top:, bottom:, dress:, outerwear:, shoes:","        )","      end","    end","","    private","","    def normalize(str)","      str.to_s.strip.downcase.gsub(/[\\s\\-]+/, \"_\")","    end","","    def sub_key(g)","      normalize(g.sub_category.presence || g.name)","    end","","    def blob(g)","      [ g.category, g.name, g.sub_category, g.material, g.fit_notes, *g.tags ].compact.join(\" \")","        .downcase.tr(\"_\", \" \")","    end","","    def top?(g)","      g.category == \"top\" && !BOTTOM_SUBCATEGORIES.include?(normalize(g.sub_category))","    end","","    def bottom?(g)","      g.category == \"bottom\" && !TOP_SUBCATEGORIES.include?(normalize(g.sub_category))","    end","","    def dress?(g)","      g.category == \"dress\"","    end","","    def gym_allowed?(g)","      b = blob(g)","      return false if SUIT_WORD_RE.match?(b)","      return false if GYM_DRESS_SHOE_RE.match?(b)","","      GYM_TAILORING_SUBSTRINGS.none? { b.include?(_1) }","    end","","    def structured_jacket?(g)","      b = blob(g)","      b.include?(\"blazer\") || b.include?(\"sport coat\") || b.include?(\"suit jacket\") ||","        (b.include?(\"suit\") && b.include?(\"jacket\"))","    end","","    def excluded_for_event?(g, type)","      EXCLUDED_SUBCATEGORIES[type]&.include?(sub_key(g))","    end","","    def color_words(str)","      str.to_s.downcase.strip.split(/[\\s,\\/\\-_]+/).to_set","    end","","    def color_word_set(colors)","      colors.each_with_object(Set.new) { |color, words| words.merge(color_words(color)) }","    end","","    def color_score(g)","      words = color_words(g.color_primary) | color_words(g.color_secondary)","      return 0.0 if words.empty?","","      score = 0.0","      score += COLOR_AVOID_PENALTY if @avoid_words.any? && !(words & @avoid_words).empty?","      score += COLOR_MATCH_BONUS if @fav_words.any? && !(words & @fav_words).empty?","      if @tone == \"warm\" && !(words & WARM_COLORS).empty?","        score += COLOR_TONE_BONUS","      elsif @tone == \"cool\" && !(words & COOL_COLORS).empty?","        score += COLOR_TONE_BONUS","      end","      score","    end","","    def size_label(measurements)","      return nil unless measurements","","      ref = measurements[:chest_cm] || measurements[:waist_cm]","      return nil unless ref","","      case ref","      when ..82 then \"xs\"","      when ..86 then \"s\"","      when ..90 then \"m\"","      when ..96 then \"l\"","      when ..104 then \"xl\"","      else \"xxl\"","      end","    end","","    def size_band_index(label)","      norm = label.to_s.strip.downcase","      SIZE_BANDS.index { _1.include?(norm) } || -1","    end","","    def size_match?(g, label)","      return false if g.size.blank?","","      g_band = size_band_index(g.size)","      u_band = size_band_index(label)","      g_band != -1 && u_band != -1 && g_band == u_band","    end","","    def apply_gender_filter(garments)","      gender = @context.gender&.to_s&.downcase","      opposite = case gender","      when \"male\" then \"women\"","      when \"female\" then \"men\"","      end","      return garments unless opposite","","      garments.reject { _1.gender == opposite }","    end","","    def pick(pool, type_fn, chain, used:, event_type:, label:, extra: nil, tiebreak: nil, allow_reuse: true)","      matching = pool.select do |g|","        type_fn.call(g) && !excluded_for_event?(g, event_type) && (extra.nil? || extra.call(g))","      end","      clean_matching = matching.select(&:clean?)","      candidates = clean_matching.any? ? clean_matching : matching","      return nil if candidates.empty?","","      scores = candidates.index_with { color_score(_1) }","      candidates.sort_by! do |g|","        tb = tiebreak ? tiebreak.call(g) : 0","        [ @recently_worn.include?(g.id) ? 1 : 0, g.times_recommended, tb, -scores[g], g.id ]","      end","","      tiers = chain.map(&:to_set) + [ :untagged ]","      tiers.each do |tier|","        subset = if tier == :untagged","          candidates.select { _1.formality.nil? }","        else","          candidates.select { _1.formality.present? && tier.include?(_1.formality) }","        end","        result = pick_from(subset, used:, label:, scores:, allow_reuse:)","        return result if result","      end","      nil","    end","","    def pick_from(subset, used:, label:, scores:, allow_reuse:)","      return nil if subset.empty?","","      if allow_reuse","        unused = subset.reject { used.include?(_1.id) }","        in_use = subset.select { used.include?(_1.id) }","        best(unused, label:, scores:) || best(in_use, label:, scores:)","      else","        best(subset.reject { used.include?(_1.id) }, label:, scores:)","      end","    end","","    def best(items, label:, scores:)","      return nil if items.empty?","","      if label","        sized_clean = items.select { size_match?(_1, label) && scores[_1] >= 0 }","        return sized_clean.first if sized_clean.any?","","        sized_any = items.select { size_match?(_1, label) }","        return sized_any.first if sized_any.any?","      end","","      not_avoided = items.select { scores[_1] >= 0 }","      return not_avoided.first if not_avoided.any?","","      items.first","    end","","    def pick_outerwear(pool, top:, displayed:, day_index:)","      return nil unless OUTERWEAR_EVENTS.include?(displayed)","      return nil if top && STRUCTURED_TOP_RE.match?(blob(top))","","      outer = pool.select { _1.category == \"outerwear\" }","      return nil if outer.empty?","      clean_outer = outer.select(&:clean?)","      outer = clean_outer if clean_outer.any?","","      if top && (structured_jacket?(top) || STRUCTURED_TOP_RE.match?(blob(top)))","        filtered = outer.reject { structured_jacket?(_1) || blob(_1).include?(\"blazer\") }","        outer = filtered unless filtered.empty?","      end","","      sorted = outer.sort_by { [ _1.times_recommended, _1.id ] }","      sorted[day_index % sorted.size]","    end","","    def pick_shoes(pool, type:, chain:, label:, used:)","      shoe_pool = pool.select { _1.category == \"shoes\" }","      return nil if shoe_pool.empty?","","      # Issue #8 / #9: like pick, prefer clean shoes; the gym branch and the fallbacks below skip pick.","      clean_shoes = shoe_pool.select(&:clean?)","      shoe_pool = clean_shoes if clean_shoes.any?","","      if type == \"gym\"","        casual = shoe_pool.reject { DRESS_SHOE_RE.match?(blob(_1)) }","        return (casual.first || shoe_pool.min_by { [ _1.times_recommended, _1.id ] })","      end","","      picked = pick(shoe_pool, ->(g) { g.category == \"shoes\" }, chain, used:, event_type: type, label:)","      picked || shoe_pool.min_by { [ _1.times_recommended, _1.id ] }","    end","  end","end"],"lines":[null,null,2,null,2,2,null,2,null,null,null,2,null,null,null,null,2,null,null,2,null,null,null,2,null,2,2,null,2,null,null,2,null,2,null,2,2,2,null,2,2,2,null,null,null,null,2,45,null,null,2,45,45,45,45,45,45,45,45,null,null,2,45,45,45,null,45,239,239,239,239,239,337,null,239,239,20,null,null,239,223,223,223,31,31,1,1,null,null,null,null,646,null,239,239,228,228,252,null,239,null,239,null,null,null,null,null,2,null,2,1323,null,null,2,414,null,null,2,357,null,null,null,2,1394,null,null,2,1394,null,null,2,273,null,null,2,100,100,100,null,858,null,null,2,120,120,120,null,null,2,1208,null,null,2,2287,null,null,2,91,null,null,2,1143,1143,null,906,906,906,906,0,906,0,null,906,null,null,2,45,null,0,0,null,0,0,0,0,0,0,0,null,null,null,2,0,0,null,null,2,0,null,0,0,0,null,null,2,45,45,0,1,null,45,null,4,null,null,2,655,3343,null,655,655,655,null,1761,618,1143,1143,null,null,618,618,791,132,null,2015,null,791,791,null,null,null,null,2,791,null,552,1112,1112,536,null,32,null,null,null,2,808,null,552,0,0,null,0,0,null,null,1137,552,null,0,null,null,2,237,81,null,693,81,22,22,null,22,0,0,null,null,64,22,null,null,2,1780,237,null,null,185,185,null,185,66,24,null,null,444,175,null,null,null],"lines_covered_percent":86.1878453038674,"covered_lines":156,"missed_lines":25,"omitted_lines":126,"total_lines":181},"app/services/planner/weather.rb":{"source":["# frozen_string_literal: true","","require \"faraday\"","require \"json\"","","module Planner","  class Weather","    DEFAULT_TEMP_F = 72","    DEFAULT_CONDITION = \"Sunny\"","","    DEFAULT_LOCATION = \"New York\"","","    def self.forecast_for(location:, date: Date.current)","      new(location: location, date: date).fetch_forecast","    end","","    # The user's city from their time zone (\"America/New_York\" -> \"New York\"), the same rule the week plan,","    # outfits and weather controllers use. OpenWeatherMap's q= rejects \"New York, NY\" (404), which would","    # silently fall back to the default forecast.","    def self.location_for(user)","      zone = user&.time_zone.to_s","      iana = ActiveSupport::TimeZone::MAPPING[zone] || zone","      city = iana.split(\"/\").last&.tr(\"_\", \" \") if iana.include?(\"/\") && !iana.start_with?(\"Etc/\") # Etc/UTC: no city","      city.presence || DEFAULT_LOCATION","    end","","    def initialize(location:, date: Date.current)","      @location = location.to_s.strip","      @date = date","    end","","    def fetch_forecast","      return default_forecast if api_key.blank? || @location.blank?","","      response = connection.get(\"weather\") do |req|","        req.params[\"q\"] = @location","        req.params[\"appid\"] = api_key","        req.params[\"units\"] = \"imperial\"","      end","","      return default_forecast unless response.success?","","      data = JSON.parse(response.body)","      {","        temp_f: data.dig(\"main\", \"temp\")&.round || DEFAULT_TEMP_F,","        condition: data.dig(\"weather\", 0, \"main\") || DEFAULT_CONDITION,","        location: @location,","        date: @date","      }","    rescue Faraday::Error, JSON::ParserError => e","      Rails.logger.warn(\"Planner::Weather API error: #{e.message}\")","      default_forecast","    end","","    private","","    def api_key","      ENV[\"WEATHER_API_KEY\"].presence || Rails.application.credenti
