name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.12
          bundler-cache: true
      - run: bin/rubocop
      - run: bin/brakeman --no-pager -q -w2
      - run: bundle exec bundler-audit check --update

  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      AI_ADAPTER: fake
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/misfit_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.12
          bundler-cache: true
      - uses: browser-actions/setup-chrome@v1
      # The app and its specs process images with libvips (ruby-vips), which the runner does not ship.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - run: bin/rails db:prepare
      - run: COVERAGE=true bundle exec rspec

  cucumber:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      AI_ADAPTER: fake
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/misfit_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.12
          bundler-cache: true
      - uses: browser-actions/setup-chrome@v1
      # The app and its specs process images with libvips (ruby-vips), which the runner does not ship.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - run: bin/rails db:prepare
      - run: bundle exec cucumber --format progress
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capybara-screenshots
          path: tmp/capybara
