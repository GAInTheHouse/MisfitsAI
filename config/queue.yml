default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  dispatchers:
    - polling_interval: 1
      batch_size: 100
  workers:
    - queues: [ ai_images ]
      threads: 1
      processes: 1
      polling_interval: 0.5
    - queues: [ ai_text, default, calendar, mailers ]
      threads: 2
      processes: 1
      polling_interval: 0.5
