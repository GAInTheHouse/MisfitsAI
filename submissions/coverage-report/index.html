rimary\"]&.downcase if changes.key?(\"color_primary\")","        end","        drafts = @batch.garment_drafts.committable.ordered.lock.to_a","        garments = Wardrobe::AddGarments.call(user: @batch.user, items: drafts.map { item_for(_1) },","                                              source: :receipt, generate_images: @generate_images)","        drafts.each { _1.update!(status: \"committed\") }","        garments","      end","    end","","    private","","    def item_for(draft)","      attrs = draft.garment_attributes","      cents = attrs[\"price_cents\"]","      # 6.12: \"fit_notes gets \"Receipt price: $%.2f\" when a price exists\"","      attrs.merge(\"fit_notes\" => cents ? format(\"Receipt price: $%.2f\", cents / 100.0) : nil).compact","    end","","    def price_cents(value)","      return if value.blank?","","      match = PRICE_RE.match(value.to_s.strip)","      raise InvalidEditError.new(INVALID_PRICE) unless match","","      (match[1].tr(\",\", \".\").to_f * 100).round","    end","  end","end"],"lines":[null,null,2,null,null,null,null,null,null,null,null,2,2,2,2,null,2,22,null,null,2,22,22,22,null,null,2,22,22,15,13,null,20,48,null,45,19,null,null,null,2,null,2,28,28,null,28,null,null,2,10,null,9,9,null,7,null,null,null],"lines_covered_percent":100.0,"covered_lines":30,"missed_lines":0,"omitted_lines":29,"total_lines":30},"app/services/receipts/intake.rb":{"source":["# frozen_string_literal: true","","module Receipts","  # Creates receipt batches and their drafts (design doc 6.12). Parsed items become garment_drafts whose","  # attrs hold name, brand, size, color_primary, category, price_cents, confidence, needs_confirmation and","  # source_line.","  module Intake","    NO_ITEMS = \"We couldn't find any clothing items on that receipt.\"","","    module_function","","    # Pasted text, a text file or a PDF: parsed in the request (6.12 \"Synchronous\"). Nothing is stored as a file.","    # The batch and its drafts are created in one transaction, so ates to at most ~4 MB (zlib's ratio is ~1:1000)","    TIMEOUT = 5 # seconds","","    UNREADABLE = \"We couldn't read that PDF. Try pasting the receipt text instead.\"","    TOO_COMPLEX = \"That PDF is too large or complex to read. Try pasting the receipt text instead.\"","","    class ReadTimeout \u003c StandardError; end","    class ContentTooLarge \u003c StandardError; end","","    def self.call(io)","      new.call(io)","    end","","    def call(io)","      Timeout.timeout(TIMEOUT, ReadTimeout) do","        reader = PDF::Reader.new(io)","        @budget = MAX_INFLATED_BYTES","        pages = (1..[ reader.page_count, MAX_PAGES ].min).map do |number|","          page = reader.page(number)","          check_inflated_size!(page)","          page.text","        end","        pages.join(\"\\n\").first(MAX_CHARS)","      end","    rescue ReadTimeout, ContentTooLarge => e","      raise UnreadableError.new(TOO_COMPLEX, e.class.name)","    rescue PDF::Reader::MalformedPDFError, PDF::Reader::UnsupportedFeatureError, PDF::Reader::EncryptedPDFError,","           ArgumentError, NoMethodError, TypeError => e # pdf-reader raises these on some damaged files","      raise UnreadableError.new(UNREADABLE, e.class.name)","    end","","    private","","    def check_inflated_size!(page)","      streams_of(page).each do |stream|","        @budget -= inflated_size(stream, @budget)","        raise ContentTooLarge, \"page content over #{MAX_INFLATED_BYTES} bytes\" if @budget.negative?","      end","    end","","    # The page's content streams, as pdf-reader's Page#raw_content finds them, plus its form XObjects.","    def streams_of(page)","      objects = page.objects","      contents = [ objects.deref_stream_or_array(page.page_object[:Contents]) ].flatten.compact","      forms = page.xobjects.values.map { objects.deref(_1) }.select { _1.is_a?(PDF::Reader::Stream) && _1.hash[:Subtype] == :Form }","      contents.filter_map { objects.deref_stream(_1) } + forms","    end","","    # Bytes the stream will take once decoded, counting at most limit + 1 so a bomb stops early.","    def inflated_size(stream, limit)","      data = stream.data.to_s","      return data.bytesize unless Array(stream.hash[:Filter]).include?(:FlateDecode)","","      inflater = Zlib::Inflate.new","      total = 0","      (0...data.bytesize).step(INFLATE_CHUNK) do |offset|","        total += inflater.inflate(data.byteslice(offset, INFLATE_CHUNK)).bytesize","        break if total > limit","      end","      total","    rescue Zlib::Error","      data.bytesize # damaged data: pdf-reader decides what to do with it","    ensure","      inflater&.close","    end","  end","end"],"lines":[null,null,2,2,null,2,null,null,null,null,null,null,null,null,null,null,2,2,2,2,2,2,null,2,2,null,2,2,null,2,14,null,null,2,14,14,11,11,30,30,28,null,8,null,null,3,null,null,3,null,null,2,null,2,30,30,30,null,null,null,null,2,30,30,30,60,null,null,null,2,30,30,null,26,26,26,30,30,null,26,null,0,null,30,null,null,null],"lines_covered_percent":97.87234042553192,"covered_lines":46,"missed_lines":1,"omitted_lines":40,"total_lines":47},"app/services/receipts/prompts.rb":{"source":["# frozen_string_literal: true","","module Receipts","  # Receipt vision prompt and response schema (design doc 6.12, 12.2). The wording must stay exact.","  module Prompts","    VISION = \u003c\u003c~PROMPT.strip.freeze","      You are a receipt parser for a wardrobe app.","      Given a retail receipt screenshot/photo, extract ONLY clothing/accessory line items.","      Rules:","      - Exclude subtotal, total, tax, shipping, discounts, and payment lines.","      - Include only apparel, shoes, and accessories.","      - Use null for unknown fields.","      - confidence must be between 0 and 1.","    PROMPT","","    RECEIPT_SCHEMA = {","      type: \"OBJECT\",","      properties: {","        items: { type: \"ARRAY\", items: { type: \"OBJECT\", properties: {","          name:       { type: \"STRING\" },","          brand:      { type: \"STRING\", nullable: true },","          size:       { type: \"STRING\", nullable: true },","          color:      { type: \"STRING\", nullable: true },","          category:   { type: \"STRING\", enum: %w[top bottom dress outerwear shoes accessory] },","          price:      { type: \"NUMBER\", nullable: true },","          confidence: { type: \"NUMBER\" }","        }, required: %w[name category] } }","      },","      required: %w[items]","    }.freeze","  end","end"],"lines":[null,null,2,null,2,2,null,null,null,null,null,null,null,null,null,null,2,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":4,"missed_lines":0,"omitted_lines":28,"total_lines":4},"app/services/receipts/text_parser.rb":{"source":["# frozen_string_literal: true","","module Receipts","  # Rule-based receipt parser, a port of receipt_parser.py as specified in design doc 6.12.","  #","  #   TextParser.call(text) # => [{ \"name\", \"brand\", \"size\", \"color\", \"category\", \"category_found\", \"price\",","  #                         #       \"confidence\", \"needs_confirmation\", \"source_line\" }, ...]","  #","  # [DEVIATION] Three bugs of the original are fixed (see docs/handoff/phase-2.md):","  # - sizes are looked for after removing prices, SKUs and the quantity, so \"$39.90\" no longer gives size \"39\";","  # - non-item terms match whole words (plurals allowed), so \"Cardigan\" is not excluded by \"card\";","  # - a priced line naming no garment is still returned, but always flagged and not pre-selected","  #   (category_found: false), so it is not added unless the user ticks it.","  class TextParser","    CATEGORY_KEYWORDS = {","      \"top\"       => %w[shirt t-shirt tee blouse sweater hoodie cardigan blazer polo tank top],","      \"bottom\"    => %w[jeans pants trouser shorts skirt leggings chinos bottom],","      \"dress\"     => %w[dress jumpsuit],","      \"outerwear\" => %w[jacket coat parka trench windbreaker outerwear],","      \"shoes\"     => %w[shoe sneaker loafer heel boot sandals slippers],","      \"accessory\" => %w[bag belt hat cap scarf watch sunglasses wallet bracelet necklace earring ring]","    }.freeze # insertion order matters: first category whose hint is a substring wins","    COLOR_WORDS = %w[black white gray grey blue navy brown green olive red pink purple beige cream tan","                     khaki orange yellow gold silver].to_set.freeze","    KNOWN_BRANDS = [ \"nike\", \"adidas\", \"zara\", \"h&m\", \"hm\", \"uniqlo\", \"gap\", \"levis\", \"levi's\", \"j.crew\",","                     \"jcrew\", \"mango\", \"patagonia\", \"lululemon\", \"new balance\", \"vans\", \"calvin klein\", \"ralph lauren\",","                     \"tommy hilfiger\", \"banana republic\", \"everlane\", \"madewell\" ].freeze","    NON_ITEM_TERMS = [ \"subtotal\", \"total\", \"tax\", \"shipping\", \"discount\", \"promo\", \"order\", \"invoice\",","                       \"receipt\", \"payment\", \"card\", \"visa\", \"mastercard\", \"thank\", \"return policy\" ].freeze","    # Whole words, with an optional plural (\"cards\", \"taxes\", \"thanks\"), not parts of words (\"cardigan\").","    NON_ITEM_RE = /\\b(?:#{NON_ITEM_TERMS.map { Regexp.escape(_1) }.join('|')})(?:e?s)?\\b/i","","    PRICE_RE     = /(?:usd\\s*)?\\$\\s*(\\d{1,4}(?:[.,]\\d{2})?)/i","    ALT_PRICE_RE = /\\b(\\d{1,4}[.,]\\d{2})\\b/","    SIZE_RE      = /\\b(XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|[0-9]{1,2}(?:\\.[05])?|W[0-9]{2}L[0-9]{2})\\b/i","    SKU_RE       = /\\b(?:sku|item|style|id|#)[:\\-\\s]*[a-z0-9\\-]+\\b/i","    QTY_RE       = /\\A(?:qty\\s*)?[x*]?[0-9]+\\s+/i","    LABEL_RE     = /\\b(?:qty|quantity|item|color|size)\\b[:\\-]?/i","    NAME_JUNK_RE = /[^A-Za-z0-9\\-\\s'&]/","    COLOR_STRIP  = \".,:;()[]{}\"","","    HEADER_LINES = 6","    LOW_CONFIDENCE = 0.75","    FALLBACK_MAX_CONFIDENCE = 0.59","","    def self.call(text)","      new.call(text)","    end","","    # The category of a garment name: the first category with a hint in it, else \"top\" (6.12).","    def self.infer_category(name)","      text = name.to_s.downcase","      CATEGORY_KEYWORDS.find { |_category, hints| hints.any? { text.include?(_1) } }&.first || \"top\"","    end","","    # Confidence formula (6.12 step 6), also used by VisionParser when the AI gives none.","    def self.confidence_for(category_found:, price:, size:, color:, brand:)","      score = 0.3","      score += 0.25 if category_found","      score += 0.2 if price","      score += 0.1 if size.present?","      score += 0.07 if color.present?","      score += 0.08 if brand.present?","      score.round(2).clamp(0.0, 0.99)","    end","","    # \"Titleize\": upper-case the first letter of each word (6.12 step 2).","    def self.titleize(text)","      text.to_s.split.map { |word| word[0].upcase + word[1..].to_s.downcase }.join(\" \")","    end","","    def call(text)","      lines = text.to_s.split(/\\r?\\n/).map(&:squish).reject(&:blank?)","      header_brand = find_brand(lines.first(HEADER_LINES).join(\" \"))","","      items = lines.filter_map { |line| item_line?(line) && build_item(line, header_brand) }","      items = fallback_items(lines.join(\"\\n\"), header_brand) if items.empty?","      items.uniq { |item| [ item[\"name\"].downcase, item[\"price\"].to_s ] }","    end","","    private","","    def item_line?(line)","      lowered = line.downcase","      line.length >= 4 && !line.match?(NON_ITEM_RE) &&","        (price_in(line) || CATEGORY_KEYWORDS.values.flatten.any? { lowered.include?(_1) })","    end","","    def build_item(line, header_brand)","      name = clean_name(line)","      return if name.blank?","","      lowered_name = name.downcase","      lowered_line = line.downcase","      category = CATEGORY_KEYWORDS.find { |_c, hints| hints.any? { lowered_name.include?(_1) } }&.first ||","                 CATEGORY_KEYWORDS.find { |_c, hints| hints.any? { lowered_line.include?(_1) } }&.first || \"top\"","      category_found = CATEGORY_KEYWORDS.fetch(category).any? { lowered_line.include?(_1) }","","      price = price_in(line)","      size = size_in(line)","      color = line.split.map { _1.delete(COLOR_STRIP).downcase }.find { COLOR_WORDS.include?(_1) }","      brand = find_brand(lowered_line) || header_brand","      confidence = self.class.confidence_for(category_found:, price:, size:, color:, brand:)","","      {","        \"name\" => name, \"brand\" => brand, \"size\" => size, \"color\" => color, \"category\" => category,","        \"category_found\" => category_found, \"price\" => price, \"confidence\" => confidence,","        \"needs_confirmation\" => confidence \u003c LOW_CONFIDENCE || !category_found, \"source_line\" => line","      }","    end","","    def clean_name(line)","      name = [ PRICE_RE, ALT_PRICE_RE, SIZE_RE, SKU_RE, QTY_RE, LABEL_RE ].reduce(line) { |text, re| text.gsub(re, \" \") }","      # Trims hyphens left at the ends by the removals (e.g. \"SKU: AB-12\" -> \"-\").","      self.class.titleize(name.gsub(NAME_JUNK_RE, \" \").squish.gsub(/\\A[\\s\\-]+|[\\s\\-]+\\z/, \"\"))","    end","","    # The size, looked for once prices, SKUs and the leading quantity are gone, so their digits are not","    # mistaken for a size. Real numeric sizes (10, 32, 38) and letter sizes are still found.","    def size_in(line)","      rest = [ PRICE_RE, ALT_PRICE_RE, SKU_RE, QTY_RE ].reduce(line) { |text, re| text.gsub(re, \" \") }","      rest[SIZE_RE, 1]&.upcase","    end","","    def price_in(line)","      raw = line[PRICE_RE, 1] || line[ALT_PRICE_RE, 1]","      raw&.tr(\",\", \".\")&.to_f&.round(2)","    end","","    def find_brand(text)","      lowered = text.downcase","      brand = KNOWN_BRANDS.find { lowered.include?(_1) }","      self.class.titleize(brand) if brand","    end","","    # 6.12 step 8: no item lines at all. Take a snippet around the first hint found per category.","    def fallback_items(text, header_brand)","      CATEGORY_KEYWORDS.values.filter_map do |hints|","        snippet = hints.lazy.filter_map do |hint|","          text[/([A-Za-z0-9\\s\\-]{0,24}\\b#{Regexp.escape(hint)}\\b[A-Za-z0-9\\s\\-]{0,24})/i, 1]","        end.first","        next unless snippet","","        item = build_item(snippet.squish, header_brand)","        next unless item","","        confidence = [ item[\"confidence\"], FALLBACK_MAX_CONFIDENCE ].min","        item.merge(\"confidence\" => confidence, \"needs_confirmation\" => true)","      end","    end","  end","end"],"lines":[null,null,2,null,null,null,null,null,null,null,null,null,null,2,null,2,null,null,null,null,null,null,2,null,2,null,null,2,null,null,32,null,2,2,2,2,2,2,2,2,null,2,2,2,null,2,130,null,null,null,2,3,113,null,null,null,2,159,159,159,159,159,159,159,null,null,null,2,628,null,null,2,130,130,null,370,130,189,null,null,2,null,2,240,240,1507,null,null,2,156,156,null,156,156,1397,156,538,null,156,156,1260,156,156,null,null,156,null,null,null,null,null,2,1092,null,156,null,null,null,null,2,780,156,null,null,2,336,336,null,null,2,286,6035,286,null,null,null,2,6,36,242,null,36,null,4,4,null,4,4,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":80,"missed_lines":0,"omitted_lines":72,"total_lines":80},"app/services/receipts/unreadable_error.rb":{"source":["# frozen_string_literal: true","","module Receipts","  # A receipt file whose text cannot be read (a damaged or encrypted PDF).","  class UnreadableError \u003c ApplicationError; end","end"],"lines":[null,null,2,null,2,null],"lines_covered_percent":100.0,"covered_lines":2,"missed_lines":0,"omitted_lines":4,"total_lines":2},"app/services/receipts/vision_parser.rb":{"source":["# frozen_string_literal: true","","module Receipts","  # Reads a receipt photo or screenshot with Gemini (design doc 6.12 \"image_vision\"), then normalizes items","  # to the TextParser item shape.","  #","  #   VisionParser.call(image:, user:) # => Array\u003cHash>; raises Ai::Error or Receipts::MalformedResponseError","  class VisionParser","    def self.call(image:, user:)","      response = Ai::Client.current.generate_json(","        kind: :receipt_extraction, prompt: Prompts::VISION, schema: Prompts::RECEIPT_SCHEMA, images: [ image ], user: user","      )","      normalize(response)","    end","","    # 6.12 \"Normalize the results\": drop nameless items, infer invalid categories, clamp or compute confidence.","    def self.normalize(response)","      items = response.is_a?(Hash) ? (response[\"items\"] || response[:items]) : nil","      raise MalformedResponseError, \"items missing\" unless items.is_a?(Array)","","      items.filter_map do |raw|","        next unless raw.is_a?(Hash)","","        raw = raw.stringify_keys","        name = raw[\"name\"].to_s.squish","        next if name.blank?","","        category = raw[\"category\"].to_s.downcase.presence_in(Garment::CATEGORIES) || TextParser.infer_category(name)","        price = number(raw[\"price\"])&.round(2)","        brand, size, color = raw.values_at(\"brand\", \"size\", \"color\").map { _1.to_s.squish.presence }","        confidence = number(raw[\"confidence\"])&.clamp(0.0, 0.99)&.round(2) ||","                     TextParser.confidence_for(category_found: true, price:, size:, color:, brand:)","","        { \"name\" => name.first(Garment::NAME_MAX_LENGTH), \"brand\" => brand, \"size\" => size, \"color\" => color,","          \"category\" => category, \"price\" => price, \"confidence\" => confidence,","          \"needs_confirmation\" => confidence \u003c TextParser::LOW_CONFIDENCE, \"source_line\" => nil }","      end","    end","","    def self.number(value)","      value.is_a?(Numeric) ? value.to_f : Float(value.to_s, exception: false)","    end","    private_class_method :number","  end","end"],"lines":[null,null,2,null,null,null,null,2,2,12,null,null,7,null,null,null,2,18,18,null,13,17,null,17,17,17,null,15,15,60,15,null,null,15,null,null,null,null,null,2,30,null,2,null,null],"lines_covered_percent":100.0,"covered_lines":21,"missed_lines":0,"omitted_lines":24,"total_lines":21},"app/services/wardrobe/add_garments.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # Saves several garments at once and optionally queues their product images (design doc 4.2, D10).","  # Used by the starter import (onboarding) and receipts. Garments are saved right away; images follow","  # from Wardrobe::GenerateGarmentImageJob.","  #","  #   Wardrobe::AddGarments.call(user:, items: [{ name:, category:, color:, ... }], source: :receipt,","  #                              generate_images: true) # => Array\u003cGarment>","  #","  # All items are saved or none: an invalid item raises ActiveRecord::RecordInvalid and nothing is kept.","  class AddGarments","    # Item keys that map straight onto garment columns. \"color\" is accepted as an alias for color_primary.","    ITEM_FIELDS = %w[name category sub_category color_primary color_secondary pattern material formality","                     seasonality gender brand size fit_notes price_cents source_url].freeze","","    def self.call(user:, items:, source:, generate_images: true)","      new(user:, items:, source:, generate_images:).call","    end","","    def initialize(user:, items:, source:, generate_images: true)","      @user = user","      @items = items","      @source = source.to_s","      @generate_images = generate_images","    end","","    def call","      garments = Garment.transaction do","        @items.map { |item| Garment.create!(attributes_for(item)) }","      end","      enqueue_image_jobs(garments) if @generate_images","      garments","    end","","    private","","    # Jobs are queued only once every open transaction has committed, including a caller's outer one","    # (e.g. onboarding), so a job never looks for a garment that is not saved, and a rollback queues nothing.","    # The app keeps enqueue_after_transaction_commit off, so this is done explicitly.","    def enqueue_image_jobs(garments)","      ActiveRecord.after_all_transactions_commit do","        ActiveJob.perform_all_later(garments.map { Wardrobe::GenerateGarmentImageJob.new(_1.id) })","      end","    end","","    def attributes_for(item)","      item = item.to_h.stringify_keys","      item[\"color_primary\"] = item[\"color\"] if item[\"color_primary\"].blank?","      item.slice(*ITEM_FIELDS).merge(","        \"user\" => @user,","        \"source\" => @source,","        # pending while an image is on its way; placeholder when none was asked for (design doc 5.3)","        \"image_status\" => @generate_images ? \"pending\" : \"placeholder\"","      )","    end","  end","end"],"lines":[null,null,2,null,null,null,null,null,null,null,null,2,null,2,null,null,2,36,null,null,2,36,36,36,36,null,null,2,36,112,null,33,33,null,null,2,null,null,null,null,2,25,81,null,null,null,2,76,76,76,null,null,null,76,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":24,"missed_lines":0,"omitted_lines":34,"total_lines":24},"app/services/wardrobe/draft_edits.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # Applies review edits to a batch's drafts before committing (photo intake 6.6, receipts 6.12).","  #","  #   DraftEdits.apply(batch:, edits: { draft_id => { \"selected\" =>, \"name\" =>, ... } }, fields: %w[name category])","  #","  # Only drafts of this batch that can still be committed are touched; unknown ids are ignored. \"selected\"","  # is always editable; other keys only when listed in fields. Values are squished; blanks become nil.","  # Call it inside the batch lock, before committing.","  module DraftEdits","    module_function","","    def apply(batch:, edits:, fields:)","      edits = edits.to_h.transform_keys(&:to_s)","      batch.garment_drafts.where(id: edits.keys).find_each do |draft|","        next unless GarmentDraft::COMMITTABLE_STATUSES.include?(draft.status)","","        edit = edits[draft.id].to_h.stringify_keys","        changes = edit.slice(*fields).transform_values { _1.to_s.squish.presence }","        yield(draft, changes) if block_given? # lets the caller convert values (e.g. a price)","        selected = edit.key?(\"selected\") ? ActiveModel::Type::Boolean.new.cast(edit[\"selected\"]) : draft.selected","        draft.update!(attrs: draft.attrs.merge(changes), selected: selected)","      end","    end","  end","end"],"lines":[null,null,2,null,null,null,null,null,null,null,2,2,null,2,42,42,23,null,23,83,23,21,21,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":12,"missed_lines":0,"omitted_lines":15,"total_lines":12},"app/services/wardrobe/garment_broadcasts.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # Turbo Stream updates for a garment whose image changed (design doc 2.4: same partials as the first","  # render). Used by the image jobs. Missing targets on a page are ignored by Turbo.","  module GarmentBroadcasts","    module_function","","    def image_changed(garment)","      stream = [ garment.user, :wardrobe ]","      Turbo::StreamsChannel.broadcast_replace_to(stream, target: garment, partial: \"garments/garment\",","                                                         locals: { garment: garment })","      Turbo::StreamsChannel.broadcast_replace_to(stream, target: ActionView::RecordIdentifier.dom_id(garment, :thumb),","                                                         partial: \"garments/thumb\", locals: { garment: garment })","    end","  end","end"],"lines":[null,null,2,null,null,2,2,null,2,60,60,null,60,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":7,"missed_lines":0,"omitted_lines":10,"total_lines":7},"app/services/wardrobe/photo_intake/commit.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  module PhotoIntake","    # Adds the selected drafts of a photo batch to the wardrobe (design doc 6.6 \"Commit\").","    #","    #   Commit.call(batch:, edits: { draft_id => { \"selected\" =>, \"name\" =>, \"category\" => } })","    #   # => Array\u003cGarment> (empty when nothing is left to add); raises ActiveRecord::RecordInvalid","    #","    # - Runs under a lock on the batch and only uses committable drafts, so committing twice (double click,","    #   two tabs) never creates a garment twice.","    # - The draft's image blob moves to the garment: attached to the garment, then detached from the draft","    #   without purging, so discarding or purging the batch later cannot delete the garment's image.","    # - A draft whose image is still being generated becomes a pending garment. The draft remembers it","    #   (attrs[\"garment_id\"]) and Wardrobe::GenerateDraftImageJob hands its image over when it finishes, so one","    #   AI call serves both. A delayed GenerateGarmentImageJob is the safety net if that job never delivers","    #   (failure, crash, purge): it finds the garment ready and stops, or makes the image itself.","    class Commit","      EDITABLE = %w[name category].freeze","      SAFETY_NET_DELAY = 10.minutes # matches the image jobs' concurrency window","","      def self.call(batch:, edits: {})","        new(batch:, edits:).call","      end","","      def initialize(batch:, edits:)","        @batch = batch","        @edits = edits.to_h.transform_keys(&:to_s)","      end","","      def call","        garments = []","        needs_image = []","        @batch.with_lock do","          Wardrobe::DraftEdits.apply(batch: @batch, edits: @edits, fields: EDITABLE)","          @batch.garment_drafts.committable.ordered.lock.each do |draft|","            garment = Garment.create!(draft.garment_attributes.merge(user: @batch.user, source: \"photo\",","                                                                     image_status: image_status_for(draft)))","            if draft.image.attached?","              garment.image.attach(draft.image.blob)","              draft.image.detach","            elsif draft.pending?","              needs_image \u003c\u003c garment","            end","            draft.update!(status: \"committed\", attrs: draft.attrs.merge(\"garment_id\" => garment.id))","            garments \u003c\u003c garment","          end","        end","        ActiveRecord.after_all_transactions_commit do","          needs_image.each { Wardrobe::GenerateGarmentImageJob.set(wait: SAFETY_NET_DELAY).perform_later(_1.id) }","        end","        garments","      end","","      private","","      def image_status_for(draft)","        return \"ready\" if draft.image.attached?","","        draft.pending? ? \"pending\" : \"placeholder\"","      end","    end","  end","end"],"lines":[null,null,2,2,null,null,null,null,null,null,null,null,null,null,null,null,null,2,2,2,null,2,20,null,null,2,20,20,null,null,2,20,20,20,20,20,22,null,21,5,5,16,7,null,21,21,null,null,19,26,null,19,null,null,2,null,2,22,null,17,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":31,"missed_lines":0,"omitted_lines":33,"total_lines":31},"app/services/wardrobe/photo_intake/image_preparer.rb":{"source":["# frozen_string_literal: true","","require \"vips\"","","module Wardrobe","  module PhotoIntake","    # Turns an uploaded outfit photo into the JPEG sent to Gemini (design doc 6.6: \"convert it to JPEG first","    # with vips\"; the original also converted to RGB).","    #","    # Works from a file on disk so the photo is never held in Ruby memory: the type is checked from the first","    # bytes, the pixel count from the header (nothing decoded yet, no decompression bombs), and libvips then","    # streams the file into a thumbnail (shrinking JPEGs while loading). The result is at most MAX_SIDE pixels","    # on its longer side, upright (EXIF orientation applied), sRGB, without alpha.","    #","    #   ImagePreparer.call(path, max_side: 1600) # => Ai::Image(jpeg); raises Media::InvalidImageError","    #   (receipts pass a larger max_side so small print stays legible)","    class ImagePreparer","      ALLOWED_TYPES = %w[image/jpeg image/png image/webp image/heic].freeze","      MAX_PIXELS = 50_000_000","      MAX_SIDE = 1600","      SNIFF_BYTES = 64.kilobytes","","      def self.call(path, max_side: MAX_SIDE)","        path = path.to_s","        Media::ImageNormalizer.sniff!(File.binread(path, SNIFF_BYTES).to_s, allowed: ALLOWED_TYPES)","","        header = Vips::Image.new_from_file(path, access: :sequential)","        if header.width * header.height > MAX_PIXELS","          raise Media::InvalidImageError.new(\"That photo is too large to process.\", \"#{header.width}x#{header.height}\")","        end","","        image = Vips::Image.thumbnail(path, max_side, height: max_side, size: :down)","        image = image.colourspace(:srgb) unless image.interpretation == :srgb","        image = image.flatten(background: [ 255, 255, 255 ]) if image.has_alpha?","        Ai::Image.new(bytes: image.jpegsave_buffer(Q: 90, strip: true), mime_type: \"image/jpeg\")","      rescue Vips::Error, SystemCallError => e","        raise Media::InvalidImageError.new(\"We couldn't read that photo.\", e.class.name)","      end","    end","  end","end"],"lines":[null,null,2,null,2,2,null,null,null,null,null,null,null,null,null,null,2,2,2,2,2,null,2,94,94,null,90,89,1,null,null,88,88,88,88,null,2,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":19,"missed_lines":0,"omitted_lines":22,"total_lines":19},"app/services/wardrobe/photo_intake/malformed_response_error.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  module PhotoIntake","    # The AI answered, but not in the expected shape (design doc 6.6 responseSchema).","    class MalformedResponseError \u003c StandardError; end","  end","end"],"lines":[null,null,2,2,null,2,null,null],"lines_covered_percent":100.0,"covered_lines":3,"missed_lines":0,"omitted_lines":5,"total_lines":3},"app/services/wardrobe/photo_intake/mapper.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  module PhotoIntake","    # Turns the garment_extraction response into draft attrs (design doc 6.6 \"Mapping\").","    #","    #   Mapper.call({ \"items\" => [...] }) # => Array\u003cHash> (string keys, at most VISION_MAX_GARMENT_IMAGES)","    #   raises MalformedResponseError when the response is not { \"items\" => [ {...}, ... ] }","    class Mapper","      SOLID_PATTERNS = [ \"solid\", \"none\", \"no pattern\", \"plain\", \"n/a\" ].freeze","      LOW_CONFIDENCE = 0.75 # same threshold as receipts (design doc 6.12)","","      def self.call(response)","        new.call(response)","      end","","      def call(response)","        items = response.is_a?(Hash) ? (response[\"items\"] || response[:items]) : nil","        raise MalformedResponseError, \"items missing\" unless items.is_a?(Array)","","        items.filter_map { |item| map(item.stringify_keys) if item.is_a?(Hash) }.first(max_drafts)","      end","","      private","","      def map(item)","        item_type = item[\"item_type\"].to_s.squish","        return if item_type.blank?","","        category = item[\"category\"].to_s.strip.downcase","        category_guessed = !Garment::CATEGORIES.include?(category)","        confidence = confidence_from(item[\"confidence\"])","","        box = box_from(item[\"box_2d\"])","","        {","          \"name\" => item_type.titleize.first(Garment::NAME_MAX_LENGTH).strip,","          \"item_type\" => item_type.downcase,","          \"category\" => category_guessed ? \"top\" : category,","          \"sub_category\" => Garment.normalize_kind(item[\"sub_category\"]),","          \"color_primary\" => item[\"color\"].to_s.strip.downcase.presence,","          \"pattern\" => pattern_from(item[\"pattern\"]),","          \"material\" => item[\"material\"].to_s.strip.presence,","          \"fit_notes\" => item[\"fit_style\"].to_s.strip.presence,","          \"fit_style\" => item[\"fit_style\"].to_s.strip.downcase.presence,","          \"formality\" => item[\"formality\"].to_s.presence_in(Garment::FORMALITIES),","          \"seasonality\" => item[\"seasonality\"].to_s.presence_in(Garment::SEASONALITIES),","          \"brand\" => item[\"brand\"].to_s.strip.presence,","          \"confidence\" => confidence,","          \"needs_confirmation\" => category_guessed || (confidence && confidence \u003c LOW_CONFIDENCE) || false,","          **(box ? { \"box\" => box } : {})","        }","      end","","      def box_from(raw)","        return nil unless raw.is_a?(Array) && raw.size == 4","        return nil unless raw.all? { |v| v.is_a?(Numeric) || v.to_s.match?(/\\A-?\\d+(\\.\\d+)?\\z/) }","","        values = raw.map { |v| v.to_f }","        values = values.map { |v| v / 1000.0 } if values.any? { |v| v > 1.0 } && values.all? { |v| v.between?(0.0, 1000.0) }","        return nil unless values.all? { |v| v.between?(0.0, 1.0) }","","        y_min, x_min, y_max, x_max = values","        return nil if y_max \u003c= y_min || x_max \u003c= x_min","","        values","      end","","      def pattern_from(value)","        pattern = value.to_s.strip.downcase","        pattern unless pattern.blank? || SOLID_PATTERNS.include?(pattern)","      end","","      def confidence_from(value)","        Float(value).clamp(0.0, 1.0).round(2) if value.is_a?(Numeric) || value.to_s.match?(/\\A\\d+(\\.\\d+)?\\z/)","      end","","      def max_drafts","        ENV.fetch(\"VISION_MAX_GARMENT_IMAGES\", 6).to_i.clamp(1, 20)","      end","    end","  end","end"],"lines":[null,null,2,2,null,null,null,null,2,2,2,null,2,49,null,null,2,49,49,null,116,null,null,2,null,2,71,71,null,69,69,69,null,69,null,null,69,null,69,null,null,null,null,null,null,null,null,null,null,68,69,null,null,null,2,69,15,null,15,20,15,null,3,3,null,2,null,null,2,69,69,null,null,2,69,null,null,2,43,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":39,"missed_lines":0,"omitted_lines":44,"total_lines":39},"app/services/wardrobe/photo_intake/prompts.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  module PhotoIntake","    # Prompt text and response schema for photo intake (design doc 6.6, 12.2). The wording must stay exact.","    module Prompts","      EXTRACTION = \u003c\u003c~PROMPT.strip.freeze","        You are a fashion-vision parser. The input is a personal photo; garments may be partially visible.","        Identify each distinct garment item and return one entry per garment item you can see.","        Sub-category reference lists (use these exact values when applicable):","          Tops: t-shirt, shirt, blouse, sweater, cardigan, hoodie, sweatshirt, blazer, vest,","                halter_neck, crop_top, tank_top, bodysuit, turtleneck, polo, henley","          Bottoms: jeans, trousers, pants, skirt, shorts, leggings, sweatpants, cargo pants,","                   dress pants, wide-leg pants, culottes","          Other: dress, jumpsuit, coat, jacket, parka, cardigan, sneakers, boots, heels,","                 loafers, sandals, bag, belt, scarf, hat, sunglasses","        Rules:","        - If uncertain, still choose the closest valid category.","        - item_type must be a concrete garment name (e.g. crewneck sweater, high-waist trousers).","        - When no pattern is visible, set pattern to \"solid\" (do not use values like \"none\" or \"no pattern\").","        - Recognized brands include (non-exhaustive): Zara, H&M, Urban Revivo, Uniqlo, Mango, SHEIN,","          Abercrombie & Fitch, Levi's, Ralph Lauren, Tommy Hilfiger, Nike, Adidas, Lululemon.","      PROMPT","","      # Design doc 6.6 schema. [DEVIATION] adds the optional \"confidence\" field (not in required), so the","      # review can flag uncertain items; the prompt text above is unchanged.","      GARMENT_SCHEMA = {","        type: \"OBJECT\",","        properties: {","          items: { type: \"ARRAY\", items: { type: \"OBJECT\", properties: {","            item_type:    { type: \"STRING\" },","            color:        { type: \"STRING\" },","            pattern:      { type: \"STRING\" },","            material:     { type: \"STRING\", nullable: true },","            fit_style:    { type: \"STRING\", nullable: true },","            category:     { type: \"STRING\", enum: %w[top bottom dress outerwear shoes accessory] },","            sub_category: { type: \"STRING\" },","            formality:    { type: \"STRING\", enum: %w[casual smart_casual business formal] },","            seasonality:  { type: \"STRING\", enum: %w[hot mild cold all_season] },","            brand:        { type: \"STRING\", nullable: true },","            confidence:   { type: \"NUMBER\", nullable: true,","                            description: \"How sure you are about this item, from 0 to 1.\" },","            box_2d:       { type: \"ARRAY\", nullable: true,","                            description: \"Normalized bounding box [y_min, x_min, y_max, x_max] in 0..1 or 0..1000.\",","                            items: { type: \"NUMBER\" } }","          }, required: %w[item_type color category formality seasonality] } }","        },","        required: %w[items]","      }.freeze","","      module_function","","      # Draft product image (design doc 6.6, exact): bracketed parts are left out when blank.","      def product_image(attrs)","        attrs = attrs.to_h.stringify_keys","        subject = garment_subject(attrs)","        \"product photo of a #{subject}, isolated on a pure white background, studio lighting, flat lay, \" \\","          \"high resolution, fashion photography\"","      end","","      # Image-conditioned flatlay for photo-intake drafts (reference photo in the multimodal request).","      def reference_flatlay(attrs)","        attrs = attrs.to_h.stringify_keys","        subject = garment_subject(attrs)","        \"Using the reference photo, produce a clean flat-lay product image of only the #{subject}. \" \\","          \"Match the garment's silhouette, color, pattern, and visible construction details. \" \\","          \"Remove the person, background, and any other items. \" \\","          \"Plain pure white background, studio lighting, high-resolution fashion product photography, \" \\","          \"no model, no hands.\"","      end","","      def garment_subject(attrs)","        attrs = attrs.to_h.stringify_keys","        [ attrs[\"color_primary\"], attrs[\"pattern\"], attrs[\"material\"], attrs[\"item_type\"].presence || attrs[\"name\"],","          attrs[\"fit_style\"] ].compact_blank.join(\" \")","      end","      private :garment_subject","    end","  end","end"],"lines":[null,null,2,2,null,2,2,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,2,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,2,null,null,2,2,2,2,null,null,null,null,2,38,38,38,null,null,null,null,null,null,2,40,40,null,null,2,null,null,null],"lines_covered_percent":100.0,"covered_lines":18,"missed_lines":0,"omitted_lines":62,"total_lines":18},"app/services/wardrobe/photo_intake/reference_image.rb":{"source":["# frozen_string_literal: true","","require \"vips\"","","module Wardrobe","  module PhotoIntake","    # Prepared (and optionally cropped) outfit photo for image-conditioned draft flatlays. The result is sent","    # to Gemini only; it is never stored on the draft or garment.","    #","    #   ReferenceImage.call(draft) # => Ai::Image(jpeg) or nil when the batch has no source photo","    class ReferenceImage","      MIN_CROP_SIDE = 64","      BOX_PAD_RATIO = 0.08","","      def self.call(draft)","        new(draft).call","      end","","      def initialize(draft)","        @draft = draft","        @batch = draft.intake_batch","      end","","      def call","        return nil unless @batch.source_file.attached?","","        @batch.source_file.open do |file|","          prepared = ImagePreparer.call(file.path)","          crop_to_box(prepared, @draft.attrs[\"box\"]) || prepared","        end","      rescue ActiveStorage::FileNotFoundError","        nil","      end","","      private","","      def crop_to_box(prepared, box)","        coords = normalized_box(box)","        return nil unless coords","","        image = Vips::Image.new_from_buffer(prepared.bytes, \"\", access: :sequential)","        y_min, x_min, y_max, x_max = padded_pixels(coords, image.width, image.height)","        return nil if (x_max - x_min) \u003c MIN_CROP_SIDE || (y_max - y_min) \u003c MIN_CROP_SIDE","","        cropped = image.crop(x_min, y_min, x_max - x_min, y_max - y_min)","        cropped = cropped.colourspace(:srgb) unless cropped.interpretation == :srgb","        cropped = cropped.flatten(background: [ 255, 255, 255 ]) if cropped.has_alpha?","        Ai::Image.new(bytes: cropped.jpegsave_buffer(Q: 90, strip: true), mime_type: \"image/jpeg\")","      rescue Vips::Error","        nil","      end","","      def normalized_box(box)","        return nil unless box.is_a?(Array) && box.size == 4","        return nil unless box.all? { |v| v.is_a?(Numeric) || v.to_s.match?(/\\A-?\\d+(\\.\\d+)?\\z/) }","","        values = box.map { |v| v.to_f }","        values = values.map { |v| v / 1000.0 } if values.any? { |v| v > 1.0 } && values.all? { |v| v.between?(0.0, 1000.0) }","        return nil unless values.all? { |v| v.between?(0.0, 1.0) }","","        y_min, x_min, y_max, x_max = values","        return nil if y_max \u003c= y_min || x_max \u003c= x_min","","        [ y_min, x_min, y_max, x_max ]","      end","","      def padded_pixels(coords, width, height)","        y_min, x_min, y_max, x_max = coords","        pad_x = (x_max - x_min) * BOX_PAD_RATIO","        pad_y = (y_max - y_min) * BOX_PAD_RATIO","","        x0 = ((x_min - pad_x) * width).floor.clamp(0, width - 1)","        y0 = ((y_min - pad_y) * height).floor.clamp(0, height - 1)","        x1 = ((x_max + pad_x) * width).ceil.clamp(x0 + 1, width)","        y1 = ((y_max + pad_y) * height).ceil.clamp(y0 + 1, height)","        [ y0, x0, y1, x1 ]","      end","    end","  end","end"],"lines":[null,null,2,null,2,2,null,null,null,null,2,2,2,null,2,43,null,nu al_lines":10},"app/services/wardrobe/search/add_result.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  module Search","    # Adds a picked search result to the wardrobe (design doc 6.5 \"Pick a result\"): saves the garment right","    # away with image_status \"pending\" and queues Wardrobe::ImportRemoteImageJob to download the image.","    #","    #   AddResult.call(user:, image_url:, title:, source_url:, attributes: { brand:, keywords:, category:, ... })","    #   # => Garment; raises Wardrobe::Search::Error (unusable image link) or ActiveRecord::RecordInvalid","    #","    # image_url is untrusted. Only its shape is checked here; Media::SafeFetcher decides in the job whether","    # it may be fetched.","    class AddResult","      MAX_URL_LENGTH = 2048","      UNUSABLE_IMAGE = \"That image can't be used. Pick another result.\"","      DEFAULTS = { formality: \"casual\", seasonality: \"all_season\" }.freeze # same defaults as manual add","","      def self.call(user:, image_url:, title:, source_url:, attributes:)","        new(user:, image_url:, title:, source_url:, attributes:).call","      end","","      def initialize(user:, image_url:, title:, source_url:, attributes:)","        @user = user","        @image_url = image_url","        @title = title.to_s.squish","        @source_url = source_url","        @attrs = attributes.to_h.symbolize_keys","      end","","      def call","        raise Error.new(UNUSABLE_IMAGE, status: :unprocessable_entity) unless web_url?(@image_url)","","        garment = Garment.create!(","          user: @user,","          name: name,","          category: category,","          sub_category: Garment.normalize_kind(@attrs[:kind]),","          color_primary: @attrs[:color],","          material: @attrs[:material],","          brand: @attrs[:brand],","          formality: @attrs[:formality].presence || DEFAULTS[:formality],","          seasonality: @attrs[:seasonality].presence || DEFAULTS[:seasonality],","          gender: @attrs[:gender].to_s.presence_in(%w[men women]),","          source: \"search\",","          source_url: (@source_url if web_url?(@source_url)),","          image_status: \"pending\"","        )","        ActiveRecord.after_all_transactions_commit do","          Wardrobe::ImportRemoteImageJob.perform_later(garment.id, @image_url)","        end","        garment","      end","","      private","","      # \"the title trimmed to 80 characters, or the keywords\" (design doc 6.5)","      def name","        (@title.presence || @attrs[:keywords].to_s.squish).first(Garment::NAME_MAX_LENGTH).strip","      end","","      # The form's category, else the category of the chosen kind, else a garment noun in the title or","      # keywords (e.g. \"white shirt\" -> top). Without any of them the garment fails validation.","      def category","        @attrs[:category].to_s.presence_in(Garment::CATEGORIES) || category_from_kind || category_from_words","      end","","      def category_from_kind","        kind = @attrs[:kind].to_s.downcase","        return if kind.blank?","","        Options.fetch(:search_kinds_by_category).find { |_cat, kinds| kinds.map(&:downcase).include?(kind) }&.first&.to_s","      end","","      def category_from_words","        tokens = FilterAndRank.tokenize(\"#{@title} #{@attrs[:keywords]}\")","        WordLists::CATEGORY_BY_NOUN.find { |_cat, nouns| tokens.intersect?(nouns) }&.first","      end","","      def web_url?(value)","        return false unless value.is_a?(String) && value.length \u003c= MAX_URL_LENGTH","","        URI.parse(value).then { _1.is_a?(URI::HTTP) && _1.host.present? }","      rescue URI::InvalidURIError","        false","      end","    end","  end","end"],"lines":[null,null,2,2,null,null,null,null,null,null,null,null,2,2,2,2,null,2,79,null,null,2,79,79,79,79,79,null,null,2,79,null,71,null,null,null,null,null,null,null,null,null,null,null,71,null,null,69,68,null,69,null,null,2,null,null,2,71,null,null,null,null,2,71,null,n  def self.token_match?(blob, token)","        if token.length \u003c= WHOLE_WORD_MAX_LENGTH","          blob.match?(/(?\u003c![a-z0-9])#{Regexp.escape(token)}(?![a-z0-9])/)","        else","          blob.include?(token)","        end","      end","","      def initialize(base_query:, color:, material:, kind:)","        @required = (self.class.tokenize([ base_query, color, material, kind ].compact.join(\" \")) - STOPWORDS.to_a).uniq","      end","","      def call(results, limit:)","        scored = results.each_with_index.map { |result, index| [ result, score(blob(result)), index ] }","        # Highest score first; ties keep their original order (stable).","        ranked = scored.sort_by { |_result, score, index| [ -score, index ] }","","        kept = ranked.select { |result, score, _| score > KEEP_ABOVE && garment_noun?(blob(result)) }","        kept = ranked.select { |result, _, _| garment_noun?(blob(result)) } if kept.empty?","        kept = ranked if kept.empty?","","        kept.map(&:first).uniq { image_url(_1) }.first(limit)","      end","","      def score(blob)","        value = 0.0","        value += NEGATIVE_PENALTY * NEGATIVE_WORDS.count { self.class.token_match?(blob, _1) }","        matched = @required.count { self.class.token_match?(blob, _1) }","        value += REQUIRED_MATCH_BONUS * matched","        value += NO_REQUIRED_MATCH_PENALTY if @required.any? && matched.zero?","        value + [ APPAREL_HINT_CAP, APPAREL_HINT_BONUS * APPAREL_HINTS.count { self.class.token_match?(blob, _1) } ].min","      end","","      private","","      def blob(result)","        \"#{result['title']} #{result['link']} #{result['original']} #{result['thumbnail']}\".downcase","      end","","      def garment_noun?(blob)","        GARMENT_NOUNS.any? { self.class.token_match?(blob, _1) }","      end","","      def image_url(result)","        result[\"original\"].presence || result[\"thumbnail\"]","      end","    end","  end","end"],"lines":[null,null,2,2,null,null,null,null,2,2,null,2,2,2,2,2,2,2,null,2,87,null,null,2,355,null,null,null,2,19136,6577,null,12559,null,null,null,2,90,null,null,2,278,null,278,null,278,90,87,null,228,null,null,2,194,9894,705,194,194,7954,null,null,2,null,2,383,null,null,2,1353,null,null,2,141,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":42,"missed_lines":0,"omitted_lines":35,"total_lines":42},"app/services/wardrobe/search/image_search.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  module Search","    # Google Images search through SerpAPI for product photos (design doc 6.5). Runs inside the request; the","    # timeouts keep it well under Heroku's 30 s limit.","    #","    #   ImageSearch.call(query: \"Uniqlo white shirt\", color: \"White\", material: nil, kind: \"Oxford shirt\",","    #                    gender: \"men\", limit: 8)","    #   # => [{ image_url:, thumbnail_url:, title:, source_url: }, ...]","    #   raises Wardrobe::Search::Error with one of the messages below","    #","    # The API key only ever goes into the outgoing request's query string: it is never logged, put in an","    # error message, a cache key or a response.","    class ImageSearch","      ENDPOINT = \"https://serpapi.com/search.json\"","      OPEN_TIMEOUT = 4","      READ_TIMEOUT = 8","      CACHE_TTL = 24.hours # design doc 11.5: protects the SerpAPI free quota","      PRODUCT_TERMS = \"clothing product photo, studio, on white background\"","      EXCLUDED_TERMS = \"-person -people -model -man -woman -face -selfie\"","","      MISSING_QUERY = \"Enter a brand or keywords\"","      NOT_CONFIGURED = \"Garment search is not configured\"","      PROVIDER_FAILED = \"Garment search provider failed. Try again later.\"","      REQUEST_FAILED = \"Garment search request failed. Please retry.\"","","      def self.call(query:, color: nil, material: nil, kind: nil, gender: nil, limit: 8)","        new(query:, color:, material:, kind:, gender:, limit:).call","      end","","      def initialize(query:, color:, material:, kind:, gender:, limit:)","        @base_query = query.to_s.squish","        @color = color.presence","        @material = material.presence","        @kind = kind.presence","        @gender = gender.to_s.downcase.presence_in(%w[men women])","        @limit = limit.to_i.clamp(1, 20)","      end","","      def call","        raise Error.new(MISSING_QUERY, status: :unprocessable_entity) if @base_query.blank?","","        api_key = ENV[\"SERPAPI_KEY\"].presence","        raise Error.new(NOT_CONFIGURED, status: :service_unavailable) unless api_key","","        Rails.cache.fetch([ \"garment-image-search/v1\", Digest::SHA256.hexdigest([ q, @limit ].join(\"|\")) ],","                          expires_in: CACHE_TTL) { search(api_key) }","      end","","      # The full Google Images query (design doc 6.5 step 3, in this order).","      def q","        [","          @base_query,","          (@gender && \"for #{@gender}\"),","          @color, @material, @kind,","          PRODUCT_TERMS,","          EXCLUDED_TERMS","        ].compact.join(\" \")","      end","","      private","","      def search(api_key)","        raw = dedupe(fetch_page(api_key, page: 0))","        filtered = rank(raw)","","        # Backfill from page 2 when page 1 leaves too few (design doc 6.5 step 7). At most two SerpAPI calls.","        if filtered.size \u003c backfill_threshold","          begin","            raw = dedupe(raw + fetch_page(api_key, page: 1))","            filtered = rank(raw)","          rescue Error => e","            Rails.logger.warn(\"[Wardrobe::Search] page 2 failed (#{e.message}); keeping page 1 results\")","          end","        end","","        filtered.map do |result|","          { image_url: image_url(result), thumbnail_url: preview_url(result),","            title: result[\"title\"].to_s.squish, source_url: result[\"link\"].presence }","        end","      end","","      def backfill_threshold","        [ @limit, [ 2, (@limit + 1) / 2 ].max ].min","      end","","      def rank(raw)","        FilterAndRank.call(raw, base_query: @base_query, color: @color, material: @material, kind: @kind, limit: @limit)","      end","","      # The browser only ever loads a thumbnail from a host the CSP allows (config.x.search_thumbnail_hosts);","      # any other result gets no preview, so the page never contacts an arbitrary host.","      def preview_url(result)","        url = result[\"thumbnail\"]","        url if URI.parse(url).then { _1.is_a?(URI::HTTPS) && _1.host.in?(Rails.configuration.x.search_thumbnail_hosts) }","      rescue URI::InvalidURIError, TypeError","        nil","      end","","      def fetch_page(api_key, page:)","        params = { engine: \"google_images\", q: q, api_key: api_key, num: @limit }","        params[:ijn] = page if page.positive?","        response = connection.get(ENDPOINT, params)","        unless response.status.between?(200, 299)","          Rails.logger.warn(\"[Wardrobe::Search] SerpAPI responded #{response.status}\")","          raise Error.new(PROVIDER_FAILED, status: :bad_gateway, internal_message: \"HTTP #{response.status}\")","        end","","        results_from(response.body, api_key)","      rescue Faraday::TimeoutError, Faraday::ConnectionFailed => e","        Rails.logger.warn(\"[Wardrobe::Search] SerpAPI request failed: #{e.class}\")","        raise Error.new(REQUEST_FAILED, status: :gateway_timeout, internal_message: e.class.name)","      end","","      def results_from(body, api_key)","        json = JSON.parse(body)","        # SerpAPI answers 200 with an \"error\" when Google simply found nothing; that is an empty result.","        if json[\"error\"].present?","          return [] if json[\"error\"].match?(/hasn't returned any results/i)","","          raise Error.new(PROVIDER_FAILED, status: :bad_gateway, internal_message: \"SerpAPI error\")","        end","        Array(json[\"images_results\"]).filter_map { web_urls_only(_1, api_key) if _1.is_a?(Hash) }","      rescue JSON::ParserError","        raise Error.new(PROVIDER_FAILED, status: :bad_gateway, internal_message: \"invalid JSON\")","      end","","      # Keeps only plain http(s) links (Google sometimes returns data: URIs) and drops results without an image.","      # A link that carries our API key, or any api_key parameter, is dropped too, so it can never reach the page.","      def web_urls_only(result, api_key)","        result = result.merge(%w[original thumbnail link].to_h { [ _1, (result[_1] if web_url?(result[_1], api_key)) ] })","        result if result[\"original\"] || result[\"thumbnail\"]","      end","","      def web_url?(value, api_key)","        return false unless value.is_a?(String) && value.length \u003c= 2048 && !value.include?(api_key)","","        uri = URI.parse(value)","        uri.is_a?(URI::HTTP) && uri.host.present? && uri.userinfo.nil? &&","          URI.decode_www_form(uri.query.to_s).none? { |key, _| key.casecmp?(\"api_key\") }","      rescue URI::InvalidURIError, ArgumentError","        false","      end","","      def dedupe(results)","        results.uniq { image_url(_1) }","      end","","      def image_url(result)","        result[\"original\"].presence || result[\"thumbnail\"]","      end","","      def connection","        Faraday.new do |f|","          f.options.open_timeout = OPEN_TIMEOUT","          f.options.timeout = READ_TIMEOUT","          f.adapter Faraday.default_adapter","        end","      end","    end","  end","end"],"lines":[null,null,2,2,null,null,null,null,null,null,null,null,null,null,2,2,2,2,2,2,2,null,2,2,2,2,null,2,165,null,null,2,167,167,167,167,167,167,null,null,2,165,null,162,162,null,159,60,null,null,null,2,null,256,256,null,null,null,null,null,null,2,null,2,60,44,null,null,44,null,35,34,null,1,null,null,null,44,128,null,null,null,null,2,44,null,null,2,78,null,null,null,null,2,128,150,null,106,null,null,2,95,95,95,90,10,10,null,null,80,null,5,5,null,null,2,80,null,79,3,null,1,null,237,null,1,null,null, .freeze","","      # Words common on apparel product pages; each one found adds a little to the score (capped).","      APPAREL_HINTS = %w[","        cotton wool linen denim silk cashmere leather suede knit fleece polyester nylon","        fit slim regular relaxed oversized tailored cropped stretch","        sleeve sleeves collar neck crew button buttons zip pocket pockets waist rise hem cuff lining","        garment menswear womenswear apparel clothing","      ].to_set.freeze","","      # A result must mention one of these to count as a garment (the noun gate). Covers every kind in","      # design doc 12.3 plus common synonyms.","      GARMENT_NOUNS = %w[","        shirt shirts tshirt tee tees top tops blouse sweater sweaters jumper pullover cardigan hoodie hoody","        sweatshirt blazer vest waistcoat polo henley turtleneck bodysuit tank camisole flannel oxford","        jacket jackets coat coats parka trench peacoat puffer bomber fleece anorak windbreaker gilet","        jeans pants trousers trouser chinos chino shorts skirt skirts leggings sweatpants joggers culottes cargo","        dress dresses gown jumpsuit romper playsuit sundress","        shoe shoes sneaker sneakers trainer trainers boot boots heel heels pump pumps loafer loafers oxfords","        sandal sandals slide slides flats mule mules","        bag bags handbag tote backpack crossbody belt scarf hat beanie cap sunglasses watch socks tie","        necklace bracelet earrings","      ].to_set.freeze","","      # Garment nouns that identify a category, used to fill in a missing category when a search result is","      # added (Phase 2 decision; the doc leaves it to \"the form attributes\").","      CATEGORY_BY_NOUN = {","        \"top\" => %w[shirt tshirt tee top blouse sweater jumper pullover cardigan hoodie hoody sweatshirt blazer","                    vest waistcoat polo henley turtleneck bodysuit tank camisole flannel],","        \"bottom\" => %w[jeans pants trousers trouser chinos chino shorts skirt leggings sweatpants joggers culottes],","        \"dress\" => %w[dress gown jumpsuit romper playsuit sundress],","        \"outerwear\" => %w[jacket coat parka trench peacoat puffer bomber anorak windbreaker gilet],","        \"shoes\" => %w[shoe shoes sneaker sneakers trainer trainers boot boots heel heels pump pumps loafer loafers","                      oxfords sandal sandals slide slides flats mule mules],","        \"accessory\" => %w[bag handbag tote backpack crossbody belt scarf hat beanie cap sunglasses watch socks tie","                          necklace bracelet earrings]","      }.freeze","    end","  end","end"],"lines":[null,null,2,2,null,null,null,null,null,null,2,null,2,null,null,null,null,null,null,null,2,null,null,null,null,null,null,null,null,2,null,null,null,null,null,null,null,null,2,null,null,null,null,null,null,null,null,null,null,null,null,null,null,2,null,null,null,null,null,null,null,null,null,null,null,null],"lines_covered_percent":100.0,"covered_lines":8,"missed_lines":0,"omitted_lines":58,"total_lines":8},"app/services/wardrobe/set_hidden.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # Hides a garment from (or returns it to) outfit recommendations and refreshes its card on every open","  # wardrobe page (design doc 4.2). Phase 3's outfit page calls this too.","  class SetHidden","    def self.call(user:, garment:, hidden:)","      new(user:, garment:, hidden:).call","    end","","    def initialize(user:, garment:, hidden:)","      @user = user","      @garment = garment","      @hidden = ActiveModel::Type::Boolean.new.cast(hidden)","    end","","    def call","      # Callers look the garment up through current_user; this guards against any that do not.","      raise ActiveRecord::RecordNotFound, \"Garment not found\" unless @garment.user_id == @user.id","","      @garment.update!(hidden_from_recommendations: @hidden)","      Turbo::StreamsChannel.broadcast_replace_to(","        [ @user, :wardrobe ], target: @garment, partial: \"garments/garment\", locals: { garment: @garment }","      )","      # Planning eligibility counts visible garments only, so the wardrobe header can change too.","      Turbo::StreamsChannel.broadcast_replace_to(","        [ @user, :wardrobe ], target: \"wardrobe_status\", partial: \"garments/status\", locals: { user: @user }","      )","      @garment","    end","  end","end"],"lines":[null,null,2,null,null,2,2,19,null,null,2,19,19,19,null,null,2,null,19,null,18,18,null,null,null,18,null,null,18,null,null,null],"lines_covered_percent":100.0,"covered_lines":14,"missed_lines":0,"omitted_lines":18,"total_lines":14},"app/services/wardrobe/starter_import.rb":{"source":["# frozen_string_literal: true","","module Wardrobe","  # Onboarding's \"Build My Wardrobe\" step (design doc 4.2, 6.3): saves the reviewed starter items right away","  # with source \"starter\" and image_status \"pending\", and queues one product image job per garment.","  #","  #   Wardrobe::StarterImport.call(user:, items: [{ name:, category:, color:, size:, formality:, seasonality: }])","  #   # => Array\u003cGarment>","  #","  # Items may also carry sub_category (design doc 12.3 starter catalog). Season defaults to all_season.","  # It runs inside the onboarding request, so it only writes rows and enqueues jobs: no AI calls.","  class StarterImport","    DEFAULT_SEASONALITY = \"all_season\"","","    def self.call(user:, items:)","      items = items.map do |item|","        item = item.to_h.stringify_keys","        item.merge(\"seasonality\" => item[\"seasonality\"].presence || DEFAULT_SEASONALITY)","      end","      Wardrobe::AddGarments.call(user: user, items: items, source: :starter, generate_images: true)","    end","  end","end"],"lines":[null,null,2,null,null,null,null,null,null,null,null,2,2,null,2,6,32,32,null,6,null,null,null],"lines_covered_percent":100.0,"covered_lines":8,"missed_lines":0,"omitted_lines":15,"total_lines":8}},"groups":{"Services":{"lines":{"covered":17
